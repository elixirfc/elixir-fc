<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Elixir FC</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --deep:#241848;
  --violet:#43307F;
  --amber:#F2B04A;
  --bg:#F5F3FB;
  --card:#FFFFFF;
  --line:#DDD7EE;
  --text:#1F1838;
  --muted:#6B6585;
  --here:#1F8A70;
  --late:#C98A1B;
  --out:#C0443C;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font-family:"Gill Sans","Gill Sans MT",Calibri,"Trebuchet MS",system-ui,sans-serif;font-size:16px;line-height:1.35;-webkit-text-size-adjust:100%}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 100px}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
header{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:14px}
h1{margin:0;font-size:24px;font-weight:800;letter-spacing:.2px;color:var(--deep)}
.sub{color:var(--muted);font-size:14px}
h2{margin:0 0 8px;font-size:17px;font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.muted{color:var(--muted)}
.small{font-size:13px}
.banner{background:#FFF3D6;border:1px solid #EBCB85;border-radius:10px;padding:8px 12px;margin-bottom:12px;font-size:14px}

/* buttons */
.btn{border:1px solid var(--line);background:#fff;border-radius:10px;min-height:44px;padding:0 14px;font-weight:600}
.btn.primary{background:var(--violet);border-color:var(--violet);color:#fff}
.btn.danger{color:var(--out);border-color:#E8C2BF}
.btn.armed{background:var(--out);border-color:var(--out);color:#fff}
.btn.small{min-height:36px;padding:0 10px;font-size:14px}
.row{display:flex;gap:8px;align-items:center}
.row.wrap-r{flex-wrap:wrap}
.grow{flex:1}

/* inputs */
input[type=text],input[type=date],input[type=number],input[type=email],input[type=password],textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;min-height:44px}
textarea{min-height:84px;resize:vertical}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}

/* timer */
.timer{background:var(--deep);color:#fff;border-radius:18px;padding:18px 16px 16px;margin-bottom:12px}
.timer .blockname{font-size:17px;font-weight:700;opacity:.95}
.timer .clock{font-size:68px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.05;margin:2px 0 4px;letter-spacing:-1px}
.timer .left{font-size:14px;opacity:.75;margin-bottom:12px}
.segs{display:flex;gap:3px;height:10px;margin-bottom:14px}
.seg{background:rgba(255,255,255,.18);border-radius:3px;overflow:hidden;position:relative}
.seg i{position:absolute;inset:0 auto 0 0;width:0;background:var(--amber)}
.tctl{display:grid;grid-template-columns:1fr auto auto auto;gap:8px}
.tbtn{min-height:48px;border-radius:12px;border:1px solid rgba(255,255,255,.3);background:transparent;color:#fff;font-weight:700;padding:0 14px}
.tbtn.go{background:var(--amber);border-color:var(--amber);color:var(--deep);font-size:18px}
.tbtn:disabled{opacity:.4}
.timer.done .clock{color:var(--amber)}

/* blocks */
.blk{display:grid;grid-template-columns:22px 1fr 64px 36px;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.blk:first-child{border-top:0}
.blk .mark{width:10px;height:10px;border-radius:50%;background:var(--line);justify-self:center}
.blk.now .mark{background:var(--amber);box-shadow:0 0 0 3px #F2B04A44}
.blk.past .mark{background:var(--violet)}
.blk input{min-height:38px;padding:6px 8px}
.blk .x{border:0;background:transparent;color:var(--muted);font-size:20px;min-height:36px}

/* attendance */
.counts{display:flex;gap:14px;flex-wrap:wrap;margin:2px 0 10px;font-size:14px}
.counts b{font-size:18px}
.c-here b{color:var(--here)} .c-late b{color:var(--late)} .c-out b{color:var(--out)} .c-none b{color:var(--muted)}
.att{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.att:first-of-type{border-top:0}
.att .who{flex:1 1 130px;min-width:0}
.att .who b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg3{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg3 button{border:0;background:#fff;min-height:44px;min-width:58px;padding:0 6px;font-size:13px;font-weight:600;border-left:1px solid var(--line)}
.seg3 button:first-child{border-left:0}
.seg3 button.on.P{background:var(--here);color:#fff}
.seg3 button.on.L{background:var(--late);color:#fff}
.seg3 button.on.A{background:var(--out);color:#fff}
.seg3 button.on.E{background:var(--muted);color:#fff}
.grp{font-size:13px;color:var(--muted);margin:10px 0 0;padding-top:8px;border-top:1px solid var(--line)}

/* squad + log */
.pl{display:flex;align-items:center;gap:8px;padding:9px 0;border-top:1px solid var(--line)}
.pl:first-child{border-top:0}
.rate{font-variant-numeric:tabular-nums;text-align:right;min-width:92px}
.bar{height:5px;background:var(--line);border-radius:3px;margin-top:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--here)}
.sess-h{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:none;border:0;padding:0;min-height:44px}
.pill{display:inline-block;border-radius:999px;padding:1px 9px;font-size:13px;font-weight:600;margin-right:4px}
.pill.E{background:#E7E3F3;color:var(--muted)}
.pill.P{background:#DDF1EA;color:var(--here)} .pill.L{background:#FBEBCB;color:#8A5E0A} .pill.A{background:#F6DAD7;color:var(--out)}
.names{margin:6px 0;font-size:14px}
.empty{text-align:center;padding:22px 10px;color:var(--muted)}
.empty b{display:block;color:var(--text);margin-bottom:4px;font-size:17px}

/* profile + ratings */
select{border:1px solid var(--line);border-radius:8px;background:#fff;min-height:36px;padding:0 6px}
.rt{display:flex;gap:6px;align-items:center;font-size:13px;margin:4px 0 0;color:var(--muted)}
.tog{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.tog .btn.on{background:var(--violet);border-color:var(--violet);color:#fff}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.three{display:grid;grid-template-columns:1fr 36px 1fr;gap:8px;align-items:end}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.chip{border-radius:10px;padding:5px 10px;font-weight:700;min-width:44px;text-align:center;background:#EEE;font-size:15px}
.chip small{display:block;font-weight:600;font-size:11px;opacity:.8}
.chip.E{background:#E7E3F3;color:var(--muted)}
.chip.hi,.chip.P{background:#DDF1EA;color:var(--here)}
.chip.mid,.chip.L{background:#FBEBCB;color:#8A5E0A}
.chip.lo,.chip.A{background:#F6DAD7;color:var(--out)}
.big{font-size:30px;font-weight:800;line-height:1.1}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.plbtn{background:none;border:0;text-align:left;padding:0;min-height:44px;flex:1;min-width:0}
.back{border:0;background:none;color:var(--violet);font-weight:700;min-height:44px;padding:0}
/* home */
.hero{background:var(--deep);color:#fff;border-radius:18px;padding:18px 16px 16px;margin-bottom:12px}
.hero .hello{font-size:32px;font-weight:800;letter-spacing:-.5px;line-height:1.05}
.hero .hdate{opacity:.7;font-size:14px;margin:4px 0 14px}
.hero .hnow{font-size:15px;font-weight:700}
.hero .hclock{font-size:56px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.05;margin:2px 0}
.hero .hleft{font-size:14px;opacity:.75;margin-bottom:12px}
.hero .two{gap:8px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--bg);border-radius:12px;padding:10px 12px}
.tile .big{font-size:28px}
.warnbox{background:#FDE8E4;border:1px solid #E9A79B;color:#7A1F12;border-radius:12px;padding:10px 12px;margin:0 0 10px;font-size:14px}
.warnbox b{display:block;margin-bottom:2px}
.nudge{background:#FFF3D6;border:1px solid #EBCB85;border-radius:14px;padding:12px 14px;margin-bottom:12px}
.hrow{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;min-height:52px}
.hrow:first-of-type{border-top:0}
/* avatars */
.av{border-radius:50%;object-fit:cover;background:var(--violet);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;flex:none}
.filebtn{position:relative;display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 16px;border:1px solid var(--line);border-radius:10px;background:#fff;font-weight:600;font-size:14px;overflow:hidden}
.filebtn input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:100px}
.filebtn:focus-within{outline:3px solid var(--amber);outline-offset:2px}
/* cloud */
.login{max-width:420px;margin:0 auto;padding-top:6vh}
.login .brand{font-size:36px;font-weight:800;color:var(--deep);letter-spacing:-.5px;line-height:1}
.login .tag{color:var(--muted);margin:6px 0 20px}
.codebox{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:26px;font-weight:700;letter-spacing:2px;background:var(--bg);border:1px dashed var(--violet);border-radius:12px;padding:12px;text-align:center;margin:8px 0 10px;user-select:all}
.badge{text-align:right;margin:-6px 0 8px;font-size:12px;color:var(--muted)}
/* front page + topbar */
.login{max-width:480px}
.front{position:relative;border-radius:18px;overflow:hidden;margin-bottom:14px;background:var(--deep)}
.front img{display:block;width:100%;height:auto}
.front .cap{position:absolute;left:0;right:0;bottom:0;padding:34px 16px 14px;background:linear-gradient(to top,rgba(36,24,72,.92),rgba(36,24,72,0));color:#fff}
.front .cap .brand{color:#fff;font-size:34px}
.front .cap .tag{color:rgba(255,255,255,.85);margin:2px 0 0}
.topbar{display:flex;justify-content:flex-end;align-items:center;gap:10px;margin:-6px 0 8px}
.topbar .badge{margin:0}
.avbtn{border:0;background:none;padding:0;min-height:44px;min-width:44px;display:flex;align-items:center;justify-content:center;border-radius:50%}
/* nav */
nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav button{border:0;background:none;min-height:58px;font-weight:700;font-size:14px;padding:0 2px;color:var(--muted);position:relative}
.call{border-radius:14px;padding:14px;margin-bottom:12px;border:1px solid var(--line);background:#fff}
.call h2{margin:0 0 4px}
.call.in{background:#E9F6F1;border-color:#BFE3D6}
.call.not{background:#FFF7E8;border-color:#EBCB85}
.call.ask{background:#F0ECFA;border-color:#CFC4EA}
.call .warn{background:#FBEAE8;border:1px solid #E8C2BF;border-radius:10px;padding:10px;margin:10px 0}
nav button.on{color:var(--violet)}
nav button.on::before{content:"";position:absolute;top:0;left:25%;right:25%;height:3px;background:var(--violet);border-radius:0 0 3px 3px}
.toast{position:fixed;left:50%;bottom:76px;transform:translateX(-50%);background:var(--deep);color:#fff;padding:9px 16px;border-radius:999px;font-size:14px;z-index:5}

/* player pages, ranks, awards, chat */
.tog .btn{font-size:14px;line-height:1.15;padding:6px 8px}
nav button .dot{position:absolute;top:9px;left:calc(50% + 14px);width:9px;height:9px;border-radius:50%;background:var(--amber);border:2px solid #fff;box-sizing:content-box}
.rk{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.rk:first-child{border-top:0}
.rk .pos{flex:none;width:30px;height:30px;line-height:30px;border-radius:50%;text-align:center;font-weight:800;color:var(--violet);background:var(--bg);font-variant-numeric:tabular-nums}
.rk.first .pos{background:var(--amber);color:var(--deep)}
.rk .info{flex:1;min-width:0}
.rk .info b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rk .sc{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--deep);min-width:48px;text-align:right}
.rkbtn{background:none;border:0;padding:0;text-align:left;min-height:44px;flex:1;min-width:0;display:flex;align-items:center;gap:10px}
.cand{display:flex;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.cand:first-of-type{border-top:0}
.cand.mine{background:#F3F9F6;margin:0 -14px;padding:12px 14px}
.winner{background:var(--deep);color:#fff;border-radius:18px;padding:18px 16px;margin-bottom:12px;text-align:center}
.winner .wn{font-size:26px;font-weight:800;line-height:1.1;margin:8px 0 2px}
.winner .wm{opacity:.75;font-size:14px}
.msg{padding:9px 0;border-top:1px solid var(--line)}
.msg:first-child{border-top:0}
.msg .mh{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.msg .mh b{color:var(--text);font-size:15px}
.msg .tag{background:#E7E3F3;color:var(--violet);border-radius:999px;padding:0 8px;font-weight:700;font-size:12px}
.msg .tag.rep{background:#F6DAD7;color:var(--out)}
.msg .mb{margin-top:2px;overflow-wrap:anywhere;white-space:pre-wrap}
.msg.mine .mh b{color:var(--violet)}
.msg .acts{display:flex;gap:6px;margin-top:4px;flex-wrap:wrap}
.lk{border:0;background:none;color:var(--muted);font-size:13px;min-height:36px;padding:0 6px;text-decoration:underline}
.lk.bad{color:var(--out)}
.note{background:var(--bg);border-radius:10px;padding:10px 12px;font-size:14px;margin-top:10px}
.chscroll{position:relative;height:min(56vh,480px);min-height:240px;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;background:var(--bg);border-radius:14px;padding:6px 8px 10px;margin:8px 0}
.dsep{text-align:center;margin:12px 0 4px}
.dsep span{background:#E7E3F3;color:var(--violet);border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700}
.mrow{display:flex;gap:8px;align-items:flex-end;margin-top:10px}
.mrow.gp{margin-top:2px}
.mrow.me{flex-direction:row-reverse}
.mav{width:34px;flex:none}
.mcol{max-width:78%;min-width:0;display:flex;flex-direction:column}
.mrow.me .mcol{align-items:flex-end}
.mname{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:0 6px 2px}
.mname b{color:var(--text);font-size:13px}
.mname .tag{background:#E7E3F3;color:var(--violet);border-radius:999px;padding:0 8px;font-weight:700;font-size:11px}
.mname .tag.rep{background:#F6DAD7;color:var(--out)}
.bub{position:relative;background:#fff;border:1px solid var(--line);border-radius:16px 16px 16px 4px;padding:7px 10px 4px;overflow-wrap:anywhere;box-shadow:0 1px 1px rgba(31,24,56,.05)}
.bub.coach{background:#FFF3D9;border-color:#F1DDA8}
.mrow.me .bub{background:var(--violet);border-color:var(--violet);color:#fff;border-radius:16px 16px 4px 16px}
.bub .mb{white-space:pre-wrap;margin:0}
.bub .mt{display:block;text-align:right;font-size:11px;opacity:.6;margin-top:1px}
.rq{display:block;width:100%;text-align:left;border:0;border-left:3px solid var(--violet);background:rgba(67,48,127,.08);border-radius:8px;padding:4px 8px;margin-bottom:5px;font:inherit;color:inherit}
.rq b{display:block;font-size:12px;color:var(--violet)}
.rq span{display:block;font-size:13px;opacity:.85;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrow.me .rq{background:rgba(255,255,255,.16);border-left-color:#fff}
.mrow.me .rq b{color:#fff}
.macts{display:flex;gap:4px;margin:0 4px;flex-wrap:wrap}
.mrow.flash .bub{animation:flashb 1.4s}
@keyframes flashb{0%,70%{box-shadow:0 0 0 3px rgba(67,48,127,.5)}100%{box-shadow:0 0 0 0 rgba(67,48,127,0)}}
.avw{position:relative;display:inline-block;flex:none;line-height:0}
.odot{position:absolute;right:-1px;bottom:-1px;width:12px;height:12px;border-radius:50%;background:#2FB26B;border:2px solid #fff;box-sizing:border-box}
.odot.inl{position:static;display:inline-block;margin-right:6px;vertical-align:middle;width:10px;height:10px;border:0}
.onrow{display:flex;gap:12px;overflow-x:auto;padding:6px 2px 4px}
.onp{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--muted);flex:none;width:52px}
.onp span{max-width:52px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rpv{display:flex;align-items:center;gap:8px;background:var(--bg);border-left:3px solid var(--violet);border-radius:8px;padding:6px 8px;margin-top:8px}
.rpv .rpb{flex:1;min-width:0}
.rpv b{display:block;font-size:12px;color:var(--violet)}
.rpv span{display:block;font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.xbtn{border:0;background:none;font-size:18px;min-width:40px;min-height:40px;color:var(--muted)}
.cmp{margin-top:8px}
@media (prefers-reduced-motion:no-preference){.seg i{transition:width .25s linear}}
@media (max-width:370px){.timer .clock{font-size:58px}.seg3 button{min-width:50px}}

/* chat extras: stickers, photos, videos, team profiles */
.avbtn{background:none;border:0;padding:0;border-radius:50%;min-height:0;display:block;cursor:pointer;text-align:left}
.bub .avbtn{border-radius:12px}
.nmbtn{background:none;border:0;padding:0;font-weight:700;min-height:0;cursor:pointer;color:inherit}
.cmedia{display:block;max-width:100%;max-height:260px;border-radius:12px;margin:2px 0;background:#000}
.cvid{width:260px;max-width:100%}
.bub.media{padding:4px 4px 2px}
.bub.media .mt{padding-right:6px}
.stk{display:flex;flex-direction:column;align-items:center;padding:2px 14px 0}
.stk b{font-size:56px;line-height:1.1;font-weight:400}
.stk span{font-size:12px;font-weight:700;opacity:.8}
.tray{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin:8px 0}
.tray button{border:1px solid var(--line);background:#fff;border-radius:10px;min-height:48px;font-size:26px;padding:0}
.cmp .ic{min-width:44px;padding:0;display:flex;align-items:center;justify-content:center;margin:0;font-size:20px;color:var(--text);position:relative}
.pick input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.lightbox{position:fixed;inset:0;background:rgba(20,14,40,.94);z-index:60;display:flex;align-items:center;justify-content:center;padding:12px}
.lightbox img{max-width:100%;max-height:100%;border-radius:8px}
.pcard .tiles{margin-top:14px;text-align:left}
nav .in.six button{font-size:12.5px;padding:0}
.bub{touch-action:pan-y}
.mp{padding:10px 0;border-top:1px solid var(--line)}
.mp:first-of-type{border-top:0}
.seg3.lu button{flex:1}
.seg3.lu button.on.S{background:var(--here);color:#fff}
.seg3.lu button.on.B{background:var(--violet);color:#fff}
.seg3.lu button.on.N{background:var(--muted);color:#fff}
.mstats{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.mstat{display:flex;align-items:center;gap:4px;background:var(--bg);border-radius:10px;padding:2px 4px}
.mstat .l{font-size:12px;color:var(--muted);margin:0 2px 0 4px}
.mstat button{min-width:36px;min-height:36px;border:1px solid var(--line);background:#fff;border-radius:8px;font-weight:800;font-size:18px;padding:0}
.mstat b{min-width:20px;text-align:center}
nav button .nbadge{position:absolute;top:5px;left:calc(50% + 6px);min-width:18px;height:18px;border-radius:9px;background:var(--out);color:#fff;font-size:11px;font-weight:800;line-height:18px;text-align:center;padding:0 5px;box-sizing:border-box;font-style:normal;border:2px solid #fff;box-sizing:content-box}
.cb{display:inline-block;min-width:20px;height:20px;border-radius:10px;background:var(--out);color:#fff;font-size:12px;font-weight:800;line-height:20px;text-align:center;padding:0 6px;box-sizing:border-box;margin-left:4px;vertical-align:middle}
.cover{position:relative;border-radius:18px;overflow:hidden;margin-bottom:12px;background:var(--deep)}
.cover img{display:block;width:100%;height:190px;object-fit:cover;object-position:50% 35%}
.cover .cap{position:absolute;left:0;right:0;bottom:0;padding:34px 16px 12px;background:linear-gradient(to top,rgba(36,24,72,.92),rgba(36,24,72,0));color:#fff}
.cover .ct{font-size:24px;font-weight:800;line-height:1.1}
.cover .cs{font-size:14px;opacity:.85;margin-top:2px}
.pstats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}
.pst{background:var(--bg);border-radius:12px;padding:10px 4px}
.pst .big{font-size:26px}
.mres{display:flex;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--line)}
.mres:first-of-type{border-top:0}

function cloudPayload(){
  const players = (S.players || []).map(p => {
    const q = Object.assign({}, p);
    if(p._b){ SELF_FIELDS.forEach(f => { if(f in p._b) q[f] = p._b[f]; else delete q[f]; }); }
    delete q._b;
    return q;
  });
  let rankTop = [];
  try{ rankTop = rankList(null, null, RANK.minRated).ranked.filter(x => x.rank <= 10).map(x => ({id: x.id, name: x.name, rank: x.rank, score: x.score, form: round1(x.avg || 0), att: Math.round(x.att || 0)})); }catch(e){}
  /* what players may see about each other: no form, scores, notes or injuries */
  const roster = (S.players || []).map(p => ({id: p.id, name: p.name, pos: p.pos || '', num: p.num || '', age: p.age || '', foot: p.foot || '', staff: !!p.staff, role: p.staff ? (p.role || '') : '', photo: THUMBS[p.id] ? THUMBS[p.id].d : '', tk: THUMBS[p.id] ? THUMBS[p.id].k : ''}));
  try{
    const ms = (S.sessions || []).filter(x => x.type === 'match' && isFinished(x)).sort((a, b) => String(b.date).localeCompare(String(a.date))).slice(0, 40).map(x => {
      const num = v => (v === '' || v == null || isNaN(Number(v))) ? null : Number(v);
      const o = {d: x.date, o: x.opp || '', gf: num(x.gf), ga: num(x.ga), p: (S.players || []).filter(q => !q.staff && playedMatch(x, q.id)).map(q => q.id), s: lineupIds(x, 'S'), b: lineupIds(x, 'B')};
      ['g', 'a', 'y', 'r'].forEach(k => { const m = {}; Object.keys(x.pstats || {}).forEach(id => { const n = statN(x, id, k); if(n) m[id] = n; }); if(Object.keys(m).length) o[k] = m; });
      return o;
    });
    roster.push({id: '_matches', name: '', staff: false, role: '', ms});
    roster.push({id: '_rank', name: '', staff: false, role: '', top: rankTop, minRated: RANK.minRated});
  }catch(e){}
  const cmap = Object.assign({}, S.coaches || {}); if(clubId && !cmap[clubId]) cmap[clubId] = {};
  const coaches = Object.keys(cmap).map(id => ({id, name: (cmap[id] || {}).name || (id === clubId ? 'Head coach' : 'Assistant coach'), title: id === clubId ? 'Coach' : 'Assistant coach', photo: (cmap[id] || {}).photo || ''}));
  return Object.assign({}, S, {currentId: null, timer: null, players, rankTop, rankMeta: {minRated: RANK.minRated}, roster, rosterCoaches: coaches});
}

const THUMBS = {};
const thumbKey = ph => ph.length + ':' + ph.slice(-48);
function makeThumb(src, N){
  return new Promise(res => {
    const img = new Image();
    img.onload = () => { try{ const c = document.createElement('canvas'); c.width = N; c.height = N; const side = Math.min(img.naturalWidth, img.naturalHeight); c.getContext('2d').drawImage(img, (img.naturalWidth - side) / 2, (img.naturalHeight - side) / 2, side, side, 0, 0, N, N); res(c.toDataURL('image/jpeg', 0.62)); }catch(e){ res(''); } };
    img.onerror = () => res('');
    img.src = src;
  });
}
let thumbBusy = false;
async function buildThumbs(){
  if(thumbBusy || mode !== 'coach') return;
  thumbBusy = true; let changed = false;
  try{
    for(const p of (S.players || [])){
      const ph = p.photo;
      if(!ph || !/^data:image\/(jpeg|png|webp|gif);base64,/.test(ph)){ if(THUMBS[p.id]){ delete THUMBS[p.id]; changed = true; } continue; }
      const k = thumbKey(ph);
      if(THUMBS[p.id] && THUMBS[p.id].k === k) continue;
      const d = await makeThumb(ph, 72);
      if(d){ THUMBS[p.id] = {k, d}; changed = true; }
    }
  }catch(e){}
  thumbBusy = false;
  if(changed && mode === 'coach') cloudSave();
}
function applySelf(){
  (S.players || []).forEach(p => {
    if(!p._b){ p._b = {}; SELF_FIELDS.forEach(f => { if(f in p) p._b[f] = p[f]; }); }
    const o = SELF[p.id] || {};
    SELF_FIELDS.forEach(f => {
      if(o[f] != null && o[f] !== '') p[f] = o[f];
      else if(f in p._b) p[f] = p._b[f];
      else delete p[f];
    });
  });
}

  try{ if(window.storage){ await window.storage.set(KEY, str, false); ok = true; } }catch(e){}
  try{ localStorage.setItem(KEY, str); ok = true; }catch(e){}
  return ok;
}
async function kvGet(){
  try{ if(window.storage){ const r = await window.storage.get(KEY, false); if(r && r.value) return r.value; } }catch(e){}
  try{ const v = localStorage.getItem(KEY); if(v) return v; }catch(e){}
  return null;
}

const sameTime = (a, b) => !!a && !!b && Date.parse(a) === Date.parse(b);
function normalizeS(){
  if(!S.removedPlayers) S.removedPlayers = [];
  if(!S.tournaments) S.tournaments = [];
  if(!S.matchBlocks) S.matchBlocks = clone(DEFAULT_MATCH_BLOCKS);
  if(!S.blocks) S.blocks = clone(DEFAULT_BLOCKS);
  if(S.currentId && !cur()){ S.currentId = null; S.timer = null; }
  if(cur() && !S.timer) initTimer();
  catchUp();
}
/* Combine my copy with another coach's newer copy so nobody's new work is lost. */
function mergeClub(L, R){
  const out = clone(L);
  // tournament call-ups: details belong to the head coach, picks merge one by one (newest wins)
  {
    const lt = out.tournaments || [], rt = R.tournaments || [], mt = [];
    new Set(lt.map(t => t.id).concat(rt.map(t => t.id))).forEach(id => {
      const a = lt.find(t => t.id === id), b = rt.find(t => t.id === id);
      if(!a){ mt.push(clone(b)); return; }
      if(!b){ mt.push(a); return; }
      const base = isHead() ? clone(a) : clone(b), calls = {};
      new Set(Object.keys(a.calls || {}).concat(Object.keys(b.calls || {}))).forEach(pid => {
        const x = (a.calls || {})[pid], y = (b.calls || {})[pid];
        calls[pid] = !x ? y : !y ? x : ((x.at || 0) > (y.at || 0) ? x : y);
      });
      base.calls = calls; mt.push(base);
    });
    out.tournaments = mt;
  }
  const gone = new Set([].concat(L.removedPlayers || [], R.removedPlayers || []));   // players the head coach removed
  out.removedPlayers = Array.from(gone);
  if(isHead()){
    const have = new Set(out.players.map(p => p.id));
    (R.players || []).forEach(rp => { if(!have.has(rp.id) && !gone.has(rp.id)) out.players.push(clone(rp)); });
    out.players = out.players.filter(p => !gone.has(p.id));   // a removed player never comes back from an old copy
  }else{
    out.players = clone(R.players || []);   // an assistant can never change the squad
  }
  // a session the other coach deleted should not come back from an old copy
  const remoteIds = new Set((R.sessions || []).map(s => s.id));
  out.sessions = out.sessions.filter(s => remoteIds.has(s.id) || !knownIds.has(s.id));
  const me = user && user.id;
  (R.sessions || []).forEach(rs => {
    let s = out.sessions.find(x => x.id === rs.id);
    if(!s){ out.sessions.push(clone(rs)); return; }
    const localNewer = (s.leadChangedAt || 0) > (rs.leadChangedAt || 0);
    const iLead = (localNewer ? leadOf(s) : leadOf(rs)) === me;
    const lsc = s.scores || {}, rsc = rs.scores || {};
    const led = s.scoreEdits || {}, red = rs.scoreEdits || {};
    const lgr = s.scoreGrants || {}, rgr = rs.scoreGrants || {};
    if(!iLead){
      // I am not running this session: the server copy is the truth for attendance, notes and finish state
      const idx = out.sessions.indexOf(s); s = clone(rs); out.sessions[idx] = s;
    }else{
      s.marks = Object.assign({}, rs.marks || {}, s.marks || {});
      s.ratings = Object.assign({}, rs.ratings || {}, s.ratings || {});
      s.names = Object.assign({}, rs.names || {}, s.names || {});
      if(!s.notes && rs.notes) s.notes = rs.notes;
    }
    // scores: every coach owns only their own entry
    const merged = {};
    new Set(Object.keys(lsc).concat(Object.keys(rsc))).forEach(pid => {
      const mine = lsc[pid] && Object.prototype.hasOwnProperty.call(lsc[pid], me) ? {[me]: lsc[pid][me]} : {};
      merged[pid] = Object.assign({}, rsc[pid] || {}, mine);
    });
    if(Object.keys(merged).length){ s.scores = merged; Object.keys(merged).forEach(pid => recalcRating(s, pid)); }
    // score edit counts: the higher count always wins, so nobody gets extra edits by syncing
    const ed = {};
    new Set(Object.keys(led).concat(Object.keys(red))).forEach(pid => {
      ed[pid] = {};
      new Set(Object.keys(led[pid] || {}).concat(Object.keys(red[pid] || {}))).forEach(k => { ed[pid][k] = Math.max((led[pid] || {})[k] || 0, (red[pid] || {})[k] || 0); });
    });
    if(Object.keys(ed).length) s.scoreEdits = ed;
    const gr = {};
    new Set(Object.keys(lgr).concat(Object.keys(rgr))).forEach(pid => {
      gr[pid] = {};
      new Set(Object.keys(lgr[pid] || {}).concat(Object.keys(rgr[pid] || {}))).forEach(k => { gr[pid][k] = Math.max((lgr[pid] || {})[k] || 0, (rgr[pid] || {})[k] || 0); });
    });
    if(Object.keys(gr).length) s.scoreGrants = gr;
  });
  // each coach owns only their own profile
  const co = Object.assign({}, L.coaches || {}, R.coaches || {});
  if(user && L.coaches && L.coaches[user.id]) co[user.id] = L.coaches[user.id];
  out.coaches = co;
  return out;
}
function cloudSave(){
  if(mode === 'coach') setTimeout(buildThumbs, 50);
  if(mode !== 'coach' || !user || !sb) return;
  ui.sync = 'saving'; paintSync();
  clearTimeout(cloudTimer);
  cloudTimer = setTimeout(doCloudSave, 1000);
}
async function doCloudSave(){
  cloudTimer = null;
  let merged = false, pdChanged = false;
  try{
    if(cloudExists){
      const r0 = await sb.from('club_data').select('data,updated_at,player_data,player_data_at').eq('owner_id', clubId).maybeSingle();
      if(r0.error) throw r0.error;
      const row = r0.data;
      if(row && !samePd(row.player_data_at, lastPd)){
        SELF = (row.player_data && row.player_data.self) || {}; lastPd = row.player_data_at || null; pdChanged = true;
      }
      if(row && row.data && row.data.players){
        if(!sameTime(row.updated_at, lastSeen)){
          S = mergeClub(S, row.data); merged = true;
          kvSet(JSON.stringify(S));
        }else if(!isHead()){
          S.players = clone(row.data.players);
        }
        noteKnown(row.data.sessions);
      }
      if(merged || pdChanged || !isHead()) applySelf();
    }
    const plJson = JSON.stringify(cloudPayload());
    if(cloudExists && !merged && plJson === lastPayload){ ui.sync = 'saved'; paintSync(); return; }
    const ts = new Date().toISOString();
    let err = null;
    if(cloudExists){
      const r = await sb.from('club_data').update({data: cloudPayload(), updated_at: ts}).eq('owner_id', clubId).select('owner_id');
      err = r.error || ((r.data && r.data.length) ? null : new Error('no access'));
    }else{
      const r = await sb.from('club_data').insert({owner_id: clubId, data: cloudPayload(), updated_at: ts});
      err = r.error; if(!err) cloudExists = true;
    }
    if(err) throw err;
    lastSeen = ts; lastPayload = plJson; ui.sync = 'saved'; noteKnown(S.sessions);
    if(merged || pdChanged) render();
  }catch(e){
    ui.sync = 'error';
    if(!cloudTimer) cloudTimer = setTimeout(doCloudSave, 8000);
  }
  paintSync();
}
/* Check every few seconds whether the other coach saved something new. */
async function pollCloud(){
  if(mode !== 'coach' || !user || !sb || !cloudExists || cloudTimer || ui.sync === 'saving' || ui.sync === 'error') return;
  const a = document.activeElement;
  if(a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) return;
  try{
    const m = await sb.from('club_data').select('updated_at,player_data_at').eq('owner_id', clubId).maybeSingle();
    if(m.error || !m.data) return;
    const dChanged = !sameTime(m.data.updated_at, lastSeen), pChanged = !samePd(m.data.player_data_at, lastPd);
    if(!dChanged && !pChanged) return;
    const r = await sb.from('club_data').select('data,updated_at,player_data,player_data_at').eq('owner_id', clubId).maybeSingle();
    if(r.error || !r.data || cloudTimer) return;
    if(pChanged){ SELF = (r.data.player_data && r.data.player_data.self) || {}; lastPd = r.data.player_data_at || null; }
    if(dChanged && r.data.data && r.data.data.players){
      const keepOpen = S.currentId, keepTimer = S.timer;
      S = r.data.data; S.currentId = keepOpen; S.timer = keepTimer;
      lastSeen = r.data.updated_at; noteKnown(S.sessions);
      normalizeS();
    }
    applySelf();
    lastPayload = JSON.stringify(cloudPayload()); kvSet(JSON.stringify(S)); render();
  }catch(e){}
}
async function load(){
  try{
    const v = await kvGet();
    if(v){
      const d = JSON.parse(v);
      if(d && d.players && d.sessions){ S = d; if(!S.matchBlocks) S.matchBlocks = clone(DEFAULT_MATCH_BLOCKS); }
    }
  }catch(e){ /* first run or nothing saved yet */ }
}

/* ---------- timer ---------- */
const blocksOf = () => { const s = cur(); return s ? s.blocks : []; };
function initTimer(){
  const b = blocksOf();
  S.timer = {idx:0, remaining:(b[0] ? b[0].min : 0)*60000, running:false, endAt:0, done:false};
}
function catchUp(){
  const t = S.timer; if(!t || !t.running) return;
  const b = blocksOf();
  while(t.running && t.endAt <= Date.now()){
    if(t.idx < b.length-1){
      t.idx++;
      t.endAt += b[t.idx].min*60000;
    }else{
      t.running = false; t.done = true; t.remaining = 0;
    }
  }
  if(t.running) t.remaining = t.endAt - Date.now();
}
let audioCtx = null, wakeLock = null;
function prepAudio(){
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if(audioCtx.state === 'suspended') audioCtx.resume();
  }catch(e){}
}
function beep(times){
  try{
    if(navigator.vibrate) navigator.vibrate([250,120,250]);
    if(!audioCtx) return;
    for(let i=0;i<times;i++){
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.frequency.value = 880; o.connect(g); g.connect(audioCtx.destination);
      const t0 = audioCtx.currentTime + i*0.35;
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(0.4, t0+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0+0.25);
      o.start(t0); o.stop(t0+0.28);
    }
  }catch(e){}
}
async function holdScreen(on){
  try{
    if(on && navigator.wakeLock && !wakeLock){ wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => { wakeLock = null; }); }
    if(!on && wakeLock){ await wakeLock.release(); wakeLock = null; }
  }catch(e){}
}
function tStart(){
  const t = S.timer; if(!t || t.done) return;
  prepAudio();
  t.running = true; t.endAt = Date.now() + t.remaining;
  holdScreen(true); save(); render();
}
function tPause(){
  const t = S.timer; if(!t) return;
  t.remaining = Math.max(0, t.endAt - Date.now());
  t.running = false; holdScreen(false); save(); render();
}
function tGo(i){
  const t = S.timer, b = blocksOf();
  if(!t || i < 0 || i >= b.length) return;
  const was = t.running;
  t.idx = i; t.done = false; t.remaining = b[i].min*60000;
  t.endAt = Date.now() + t.remaining; t.running = was;
  save(); render();
}
function tReset(){
  const t = S.timer, b = blocksOf(); if(!t) return;
  t.done = false; t.remaining = b[t.idx].min*60000; t.endAt = Date.now() + t.remaining;
  save(); render();
}
function tick(){
  const t = S.timer; if(!t || !t.running) return;
  const idxBefore = t.idx;
  const b = blocksOf();
  if(t.endAt <= Date.now()){
    catchUp();
    if(t.done){ beep(3); holdScreen(false); toast('Session finished'); }
    else if(t.idx !== idxBefore){ beep(2); toast('Next: ' + b[t.idx].name); }
    save(); render(); return;
  }
  t.remaining = t.endAt - Date.now();
  paintTimer();
}
function mmss(ms){
  const s = Math.max(0, Math.ceil(ms/1000));
  return String(Math.floor(s/60)).padStart(2,'0') + ':' + String(s%60).padStart(2,'0');
}
function paintTimer(){
  const t = S.timer, b = blocksOf(); if(!t || !b.length) return;
  const clock = document.getElementById('clock');
  if(clock) clock.textContent = mmss(t.remaining);
  const left = document.getElementById('left');
  if(left){
    let rest = t.remaining;
    for(let i=t.idx+1;i<b.length;i++) rest += b[i].min*60000;
    left.textContent = t.done ? 'All blocks complete' : mmss(rest) + ' left in the session';
  }
  document.querySelectorAll('.seg i').forEach((el, i) => {
    const total = b[i].min*60000;
    let p = 0;
    if(i < t.idx || t.done) p = 100;
    else if(i === t.idx) p = Math.max(0, Math.min(100, (1 - t.remaining/total)*100));
    el.style.width = p + '%';
  });
}

/* ---------- attendance helpers ---------- */
function counts(s, staff){
  const ids = Object.keys(s.marks);
  const roster = S.players.filter(p => p.staff === staff);
  const c = {P:0, L:0, A:0, E:0, none:0};
  roster.forEach(p => { const m = s.marks[p.id]; if(m) c[m]++; else c.none++; });
  return c;
}
function nameOf(s, id){
  const p = S.players.find(x => x.id === id);
  return p ? p.name : (s.names && s.names[id]) || 'Unknown';
}
function listBy(s, val, staff){
  return Object.keys(s.marks).filter(id => s.marks[id] === val && isStaff(id, s) === staff).map(id => nameOf(s, id));
}
function isStaff(id, s){
  const p = S.players.find(x => x.id === id);
  if(p) return p.staff;
  return !!(s.staffIds && s.staffIds.includes(id));
}
/* ---------- match sheet: who started, subs, goals, assists, cards ---------- */
const LU = {S: 'Started', B: 'Sub on', N: 'Unused sub'};
const MAX_STARTERS = 8;   // 8-a-side football
function playedMatch(s, pid){
  const lu = s.lineup;
  if(lu && Object.keys(lu).length) return lu[pid] === 'S' || lu[pid] === 'B';
  return !!(s.marks && (s.marks[pid] === 'P' || s.marks[pid] === 'L'));
}
const pst = (s, pid) => (s.pstats && s.pstats[pid]) || {};
const statN = (s, pid, k) => Number(pst(s, pid)[k]) || 0;
function statTotal(s, k){ return Object.keys(s.pstats || {}).reduce((a, id) => a + statN(s, id, k), 0); }
function statNames(s, k){ return Object.keys(s.pstats || {}).filter(id => statN(s, id, k) > 0).map(id => nameOf(s, id) + (statN(s, id, k) > 1 ? ' x' + statN(s, id, k) : '')); }
function lineupIds(s, v){ return Object.keys(s.lineup || {}).filter(id => s.lineup[id] === v); }
function subText(s, id){ const x = (s.subs || {})[id] || {}; const bits = []; if(x.for) bits.push('for ' + nameOf(s, x.for)); if(x.min) bits.push(x.min + "'"); return nameOf(s, id) + (bits.length ? ' (' + bits.join(', ') + ')' : ''); }
function matchLines(s){
  if(s.type !== 'match') return [];
  const out = [];
  const add = (label, arr) => { if(arr.length) out.push([label, arr.join(', ')]); };
  add('Started', lineupIds(s, 'S').map(id => nameOf(s, id)));
  add('Subs on', lineupIds(s, 'B').map(id => subText(s, id)));
  add('Unused subs', lineupIds(s, 'N').map(id => nameOf(s, id)));
  add('Goals', statNames(s, 'g')); add('Assists', statNames(s, 'a')); add('Yellow cards', statNames(s, 'y')); add('Red cards', statNames(s, 'r'));
  return out;
}
const matchLinesHTML = s => matchLines(s).map(([l, t]) => `<div class="names"><b>${esc(l)}</b> ${esc(t)}</div>`).join('');
function matchSummaryHTML(s){ const h = matchLinesHTML(s); const n = lineupIds(s, 'S').length; return h ? `<div class="card"><h2>Match sheet</h2>${n > MAX_STARTERS ? `<div class="warnbox" role="alert"><b>${n} starters picked</b>We play ${MAX_STARTERS}-a-side. Ask the coach who started this match to fix it.</div>` : ''}${h}</div>` : ''; }
function playerMatchStats(pid){
  const o = {app: 0, start: 0, g: 0, a: 0, y: 0, r: 0};
  S.sessions.forEach(s => { if(s.type !== 'match') return; if(playedMatch(s, pid)) o.app++; if((s.lineup || {})[pid] === 'S') o.start++; ['g', 'a', 'y', 'r'].forEach(k => { o[k] += statN(s, pid, k); }); });
  return o;
}
function afterGoalChange(s, oldSum){ const ns = statTotal(s, 'g'); if(ns !== oldSum && (s.gf === '' || s.gf == null || Number(s.gf) === oldSum)) s.gf = ns; }
function matchLeadOk(){
  const s = cur();
  if(!s || s.type !== 'match' || !user) return null;
  if(!isLead(s)){ toast('Only the coach who started this match can do that'); return null; }
  return s;
}
function setLineup(pid, val){
  const s = matchLeadOk(); if(!s) return;
  const p = S.players.find(x => x.id === pid); if(!p) return;
  const oldSum = statTotal(s, 'g');
  s.lineup = s.lineup || {};
  if(s.lineup[pid] === val){ delete s.lineup[pid]; if(s.subs) delete s.subs[pid]; if(s.pstats) delete s.pstats[pid]; }
  else{
    s.lineup[pid] = val;
    if(val !== 'B' && s.subs) delete s.subs[pid];
    if(val === 'N' && s.pstats) delete s.pstats[pid];
    if(!s.marks[pid] || s.marks[pid] === 'A'){ s.marks[pid] = 'P'; s.names[pid] = p.name; }
  }
  afterGoalChange(s, oldSum);
  save(); render();
  const nSt = lineupIds(s, 'S').length;
  if(val === 'S' && s.lineup[pid] === 'S' && nSt > MAX_STARTERS) toast('Warning: ' + nSt + ' starters picked. We play ' + MAX_STARTERS + '-a-side, so only ' + MAX_STARTERS + ' can start.');
}
function setStat(pid, key, d){
  const s = matchLeadOk(); if(!s) return;
  const lu = (s.lineup || {})[pid]; if(lu !== 'S' && lu !== 'B') return;
  const oldSum = statTotal(s, 'g');
  s.pstats = s.pstats || {};
  const st = s.pstats[pid] = s.pstats[pid] || {};
  const max = key === 'r' ? 1 : key === 'y' ? 2 : 30;
  st[key] = Math.max(0, Math.min(max, (Number(st[key]) || 0) + d));
  if(!st[key]) delete st[key];
  if(!Object.keys(st).length) delete s.pstats[pid];
  if(key === 'g') afterGoalChange(s, oldSum);
  save(); render();
}

  return `<div class="card"><h2>Match sheet</h2>${tooMany}
    <div class="counts"><span class="c-here"><b ${nS > MAX_STARTERS ? 'style="color:var(--out)"' : ''}>${nS}</b> started${nS > MAX_STARTERS ? ' (max ' + MAX_STARTERS + ')' : ''}</span><span class="c-late"><b>${nB}</b> subs on</span><span class="c-none"><b>${nN}</b> unused</span><span class="c-out"><b>${statTotal(s, 'g')}</b> goals</span></div>
    <div class="small muted" style="margin-bottom:6px">For each player tap Started, Sub on or Unused sub. Then add goals, assists and cards. The score fills in from the goals unless you typed a different score.</div>

function scorersCard(info){
  const tot = {};
  S.sessions.filter(x => x.type === 'match' && x.finished !== false && (!info.from || x.date >= info.from) && (!info.to || x.date <= info.to)).forEach(x => {
    Object.keys(x.pstats || {}).forEach(id => { const t = tot[id] = tot[id] || {g: 0, a: 0}; t.g += statN(x, id, 'g'); t.a += statN(x, id, 'a'); });
  });
  const base = Object.keys(tot).map(id => ({id, g: tot[id].g, a: tot[id].a, p: S.players.find(q => q.id === id)})).filter(x => x.p && !x.p.staff);
  const board = (key, other, title, word) => {
    const list = base.filter(x => x[key] > 0).sort((a, b) => b[key] - a[key] || b[other] - a[other] || a.p.name.localeCompare(b.p.name));
    let prev = null, pos = 0; list.forEach((x, i) => { const k = x[key] + '|' + x[other]; if(k !== prev){ pos = i + 1; prev = k; } x.rank = pos; });
    const top = list.filter(x => x.rank <= 10);
    const sub = x => key === 'g' ? x.a + ' assist' + (x.a === 1 ? '' : 's') : x.g + ' goal' + (x.g === 1 ? '' : 's');
    return `<div class="card"><h2>${title} <span class="muted small">${esc(info.label)}</span></h2>${top.length ? top.map(x => `<div class="rk ${x.rank === 1 ? 'first' : ''}"><span class="pos">${x.rank}</span><button class="rkbtn" data-act="profile" data-id="${x.id}" aria-label="Open profile of ${esc(x.p.name)}">${avatar(x.p, 40)}<span class="info"><b>${esc(x.p.name)}</b><span class="small muted">${sub(x)}</span></span></button><span class="sc" aria-label="${x[key]} ${word}">${x[key]}</span></div>`).join('') : '<div class="empty" style="padding:10px"><b>Nothing recorded yet</b>Add ' + word + ' on the match sheet when you finish a match.</div>'}</div>`;
  };
  return board('g', 'a', 'Top scorers', 'goals') + board('a', 'g', 'Top assists', 'assists');
}
function sessLabel(s){ return s.type === 'match' ? 'Match vs ' + (s.opp || 'opponent') : (s.title || 'Training'); }
function scoreText(s){ return (s.type === 'match' && s.gf !== '' && s.ga !== '' && s.gf != null && s.ga != null) ? s.gf + '-' + s.ga : ''; }
function summaryText(s){
  const head = s.type === 'match'
    ? 'Elixir FC match: ' + (scoreText(s) ? 'Elixir FC ' + scoreText(s) + ' ' + (s.opp || 'opponent') : 'vs ' + (s.opp || 'opponent')) + ', ' + fmtDate(s.date)
    : 'Elixir FC training: ' + fmtDate(s.date) + (s.title ? ' (' + s.title + ')' : '');
  const lines = [head];
  const pl = v => listBy(s, v, false);
  const P = pl('P'), L = pl('L'), A = pl('A');
  lines.push('Present (' + P.length + '): ' + (P.join(', ') || 'none'));
  lines.push('Late (' + L.length + '): ' + (L.join(', ') || 'none'));
  lines.push('Absent (' + A.length + '): ' + (A.join(', ') || 'none'));
  const I = pl('E'); if(I.length) lines.push('Injured (' + I.length + '): ' + I.join(', '));
  matchLines(s).forEach(([l, t]) => lines.push(l + ': ' + t));
  const sp = listBy(s,'P',true).concat(listBy(s,'L',true));
  if(sp.length) lines.push('Staff: ' + sp.join(', '));
  if(s.notes && s.notes.trim()) lines.push('Notes: ' + s.notes.trim());
  return lines.join('\n');
}
function playerRate(p){
  let total = 0, att = 0;
  S.sessions.forEach(s => { if(s.type === 'match') return; const m = s.marks[p.id]; if(m && m !== 'E'){ total++; if(m === 'P') att += 1; else if(m === 'L') att += 0.5; } });
  return {total, att, pct: total ? Math.round(att/total*100) : null};
}

document.addEventListener('change', e => {

  if(k === 'cphoto' || k === 'pe_photo'){

    }).catch(() => toast('Could not use that photo'));
    return;
  }
  if(k === 'pmonth'){ ui.pmMonth = e.target.value; render(); return; }
  const i = Number(e.target.dataset.i);

  else if(k === 'blkMin'){

    const s = cur(); s.blocks[i].min = m;
    if(S.timer && i === S.timer.idx && !S.timer.running){ S.timer.remaining = m*60000; S.timer.done = false; }
    syncBlocks(); render();
  }
  else if(k === 'photo'){ if(!isHead()){ toast('Only the head coach can do that'); return; } setPhoto(e.target.dataset.id, e.target.files && e.target.files[0]); e.target.value = ''; }
  else if(k === 'newRole') { ui.newRole = e.target.value; }
  else if(k === 'subfor' || k === 'submin'){
    const ss = cur(); if(!ss || !isLead(ss)) return;
    const pid = e.target.dataset.id; ss.subs = ss.subs || {}; const x = ss.subs[pid] = ss.subs[pid] || {};

    save(); render();
  }
  else if(k === 'rating'){
    const s = cur(); if(!s || !user) return;
    if(!isFinished(s)){ toast('You can give scores when the session is finished'); render(); return; }
    const pid = e.target.dataset.id, nv = e.target.value === '' ? null : Number(e.target.value);
    const was = myScore(s, pid);
    if(!isHead() && was !== undefined && nv !== was && editsUsed(s, pid) >= MAX_SCORE_EDITS + grantsFor(s, pid, user.id)){ toast('This score is locked. The assistant coach can change a score only ' + (MAX_SCORE_EDITS === 1 ? 'once' : MAX_SCORE_EDITS + ' times') + '.'); render(); return; }
    setScore(s, pid, nv);
    save(); render();
  }
  else if(k === 'sessDate') { cur().date = e.target.value || cur().date; save(); render(); }
});

/* ---------- views ---------- */
const round1 = n => Math.round(n*10)/10;
const MAX_SCORE_EDITS = 1;   // how many times a coach can change a score after first giving it
function grantsFor(s, pid, uid){ const m = (s.scoreGrants || {})[pid]; return (m && m[uid]) || 0; }
function editsUsed(s, pid){ const m = (s.scoreEdits || {})[pid]; return (m && user && m[user.id]) || 0; }
function recalcRating(s, pid){
  s.ratings = s.ratings || {};
  const m = (s.scores || {})[pid] || {};
  const vals = Object.values(m).filter(v => v != null);
  if(vals.length) s.ratings[pid] = round1(vals.reduce((a,x) => a + Number(x), 0)/vals.length);
  else delete s.ratings[pid];
}
/* Each coach has their own score per player per session; the app stores the average in ratings. */
function setScore(s, pid, val){
  const before = myScore(s, pid);
  if(!isHead() && before !== undefined && before !== val){   // the head coach can always edit
    s.scoreEdits = s.scoreEdits || {};
    s.scoreEdits[pid] = s.scoreEdits[pid] || {};
    s.scoreEdits[pid][user.id] = editsUsed(s, pid) + 1;
  }
  s.scores = s.scores || {};
  let m = s.scores[pid];
  if(!m){
    m = {};
    if(s.ratings && s.ratings[pid] != null) m[clubId] = Number(s.ratings[pid]);   // an old single score counts as the head coach's
    s.scores[pid] = m;
  }
  m[user.id] = val;     // null means "I cleared mine"
  recalcRating(s, pid);
}
function myScore(s, pid){
  const m = (s.scores || {})[pid];
  if(m){ const v = m[user.id]; return v == null ? undefined : v; }
  return isHead() && s.ratings ? s.ratings[pid] : undefined;
}
function otherScores(s, pid){
  const m = (s.scores || {})[pid], out = [];
  if(m){
    Object.keys(m).forEach(k => { if(k !== user.id && m[k] != null) out.push([coachName(k) || (k === clubId ? 'Head coach' : 'Assistant'), m[k]]); });
  }else if(!isHead() && s.ratings && s.ratings[pid] != null){
    out.push([coachName(clubId) || 'Head coach', s.ratings[pid]]);
  }
  return out;
}
function unlockBtn(s, p){
  if(!isHead()) return '';
  const m = (s.scores || {})[p.id] || {};
  const locked = Object.keys(m).some(k => k !== clubId && m[k] != null && (((s.scoreEdits || {})[p.id] || {})[k] || 0) >= MAX_SCORE_EDITS + grantsFor(s, p.id, k));
  return locked ? `<button class="btn small" style="margin-top:6px" data-act="grantedit" data-id="${p.id}">Let assistant change this once more</button>` : '';
}
function ratingSel(s, p){
  const v = myScore(s, p.id);
  const others = otherScores(s, p.id);
  const avg = (s.ratings || {})[p.id];
  let o = '<option value="">--</option>';
  for(let i=1;i<=10;i++) o += `<option value="${i}" ${v===i?'selected':''}>${i}</option>`;
  const left = MAX_SCORE_EDITS + grantsFor(s, p.id, user.id) - editsUsed(s, p.id);
  const locked = !isHead() && v !== undefined && left <= 0;
  const hint = (isHead() || v === undefined) ? '' : (locked ? 'Locked' : left + (left === 1 ? ' change left' : ' changes left'));
  return `<label class="rt">My score <select data-in="rating" data-id="${p.id}" aria-label="My score for ${esc(p.name)}" ${locked ? 'disabled' : ''}>${o}</select>${hint ? `<span class="small muted">${hint}</span>` : ''}</label>`
    + (others.length ? `<div class="small muted">${others.map(x => esc(x[0]) + ' ' + x[1]).join(', ')}${avg != null ? '. Average ' + avg : ''}</div>` : '');
}

function setPhoto(id, file){
  const p = S.players.find(x => x.id === id); if(!p || !file) return;

      <button class="tbtn" data-act="quick" data-v="match">Start match</button></div>`;
  }

  const person = (p, right) => `<button class="hrow" data-act="profile" data-id="${p.id}" aria-label="Open profile of ${esc(p.name)}">${avatar(p, 36)}<span class="grow"><b>${esc(p.name)}</b></span>${right}</button>`;

    <div class="hdate">${today}</div>
    ${status}
  </div>

      <div class="tile"><div class="big">${matches.length}</div><div class="small muted">${(w+d+l) ? 'matches: ' + w + 'W ' + d + 'D ' + l + 'L' : 'matches'}</div></div>
    </div>
  </div>
  ${hurt.length ? `<div class="card"><h2>Injuries</h2>${hurt.map(p => person(p, `<span class="chip ${p.inj === 'I' ? 'lo' : 'mid'}" style="min-width:auto;font-size:13px">${p.inj === 'I' ? 'Injured' : 'Doubtful'}</span>`)).join('')}</div>` : ''}
  ${lastMatch ? `<div class="card"><h2>Last match</h2><button class="hrow" style="border-top:0" data-act="openlog" data-id="${lastMatch.id}"><span class="grow"><b>${esc(sessLabel(lastMatch))}</b><div class="small muted">${fmtDate(lastMatch.date)}</div></span><span class="big" style="font-size:24px">${scoreText(lastMatch) || '-'}</span></button></div>` : ''}
  ${inForm.length ? `<div class="card"><h2>In form</h2><div class="small muted" style="margin-bottom:4px">Average of the last 5 scores</div>${inForm.map(x => person(x.p, `<span class="chip ${cls(x.avg)}">${x.avg.toFixed(1)}</span>`)).join('')}</div>` : ''}
  ${watch.length ? `<div class="card"><h2>Attendance to watch</h2><div class="small muted" style="margin-bottom:4px">Lowest training attendance</div>${watch.map(x => person(x.p, `<span class="chip ${x.r.pct >= 75 ? 'mid' : 'lo'}">${x.r.pct}%</span>`)).join('')}</div>` : ''}
  ${desc.length ? `<div class="card"><h2>Recent sessions</h2>${desc.slice(0,3).map(x => { const c = counts(x, false); return `<button class="hrow" data-act="openlog" data-id="${x.id}"><span class="grow"><b>${esc(sessLabel(x))}</b>${scoreText(x) ? ' <b>' + esc(scoreText(x)) + '</b>' : ''}<div class="small muted">${fmtDate(x.date)}</div></span><span><span class="pill P">${c.P}</span><span class="pill L">${c.L}</span><span class="pill A">${c.A}</span>${c.E ? `<span class="pill E">${c.E}</span>` : ''}</span></button>`; }).join('')}</div>` : ''}`;
}
/* 'Edit my scores' once I have scored every player who was present or late, otherwise 'Give my scores'. */
function scoreBtnText(s){
  if(!s || !isFinished(s)) return 'Give my scores';
  const present = scorable(s);
  return present.length && present.every(p => myScore(s, p.id) !== undefined) ? 'Edit my scores' : 'Give my scores';
}
const leadOf = s => s.lead || clubId;                     // old sessions belong to the head coach
const isLead = s => !!s && !!user && leadOf(s) === user.id;
const isFinished = s => s.finished !== false;             // old sessions count as finished
const coachName = uid => { const c = (S.coaches || {})[uid]; return c && c.name ? c.name : ''; };
const leadLabel = s => { const u = leadOf(s); return coachName(u) || (u === clubId ? 'the head coach' : 'the assistant coach'); };
const runningSession = () => S.sessions.find(x => x.finished === false) || null;

function timerHTML(s){
  const t = S.timer, b = s.blocks;
  const segs = b.map(x => `<div class="seg" style="flex:${x.min}"><i></i></div>`).join('');
  return `<div class="timer ${t.done ? 'done' : ''}">
    <div class="blockname">${t.done ? 'Session complete' : esc(b[t.idx].name)}</div>
    <div class="clock" id="clock">${mmss(t.remaining)}</div>
    <div class="left" id="left"></div>
    <div class="segs">${segs}</div>
    <div class="tctl">
      <button class="tbtn go" data-act="tgo" ${t.done ? 'disabled' : ''}>${t.running ? 'Pause' : (t.remaining < b[t.idx].min*60000 ? 'Resume' : 'Start')}</button>
      <button class="tbtn" data-act="tprev" aria-label="Previous block" ${t.idx === 0 ? 'disabled' : ''}>Back</button>
      <button class="tbtn" data-act="treset" aria-label="Restart this block">Redo</button>
      <button class="tbtn" data-act="tnext" aria-label="Next block" ${t.idx >= b.length-1 ? 'disabled' : ''}>Skip</button>
    </div>
  </div>`;
}
function countsHTML(s){
  const c = counts(s, false);
  return `<div class="counts">
      <span class="c-here"><b>${c.P}</b> present</span>
      <span class="c-late"><b>${c.L}</b> late</span>
      <span class="c-out"><b>${c.A}</b> absent</span>
      ${c.E ? `<span class="c-none"><b>${c.E}</b> injured</span>` : ''}
      <span class="c-none"><b>${c.none}</b> unmarked</span>
    </div>`;
}
function viewStart(){
  const r = runningSession();
  if(r){
    return `<div class="card">
      <h2>A session is already running</h2>
      <div class="muted small" style="margin:4px 0 12px">${esc(sessLabel(r))} was started by ${leadLabel(r)}. Only one session runs at a time, and only the coach who started it takes attendance. You can join it, and you can give your scores when it is finished.</div>
      <button class="btn primary" style="width:100%" data-act="open" data-id="${r.id}">Join session</button>
    </div>`;
  }
  return `<div class="card">
      <h2>Start a session</h2>
      <div class="muted small" style="margin:4px 0 8px">You will be the coach who takes attendance and finishes it. The other coach can join and score afterwards.</div>
      <div class="tog" style="margin-top:8px">
        <button class="btn ${ui.draftType!=='match'?'on':''}" data-act="draftType" data-v="training">Training</button>
        <button class="btn ${ui.draftType==='match'?'on':''}" data-act="draftType" data-v="match">Match</button>
      </div>
      ${ui.draftType === 'match'
        ? `<label for="do">Opponent</label><input type="text" id="do" data-in="draftOpp" value="${esc(ui.draftOpp)}" autocomplete="off">`
        : `<label for="dt">Session name</label><input type="text" id="dt" data-in="draftTitle" value="${esc(ui.draftTitle)}">`}
      <div style="height:10px"></div>
      <label for="dd">Date</label>
      <input type="date" id="dd" data-in="draftDate" value="${esc(ui.draftDate)}">
      <div style="height:12px"></div>
      <button class="btn primary" style="width:100%" data-act="start">Start ${ui.draftType==='match'?'match':'session'}</button>
    </div>

}
function headerCard(s, editable){
  const score = scoreText(s);
  if(!editable){
    return `<div class="card"><b>${esc(sessLabel(s))}</b>${score ? ' <b>' + esc(score) + '</b>' : ''}<div class="small muted">${fmtDate(s.date)}</div></div>`;
  }
  return `<div class="card">
    <div class="row">
      <div class="grow">${s.type === 'match'
        ? `<label for="so">Opponent</label><input type="text" id="so" data-in="opp" value="${esc(s.opp || '')}" autocomplete="off">`
        : `<label for="st">Session</label><input type="text" id="st" data-in="title" value="${esc(s.title)}">`}</div>
      <div style="width:150px"><label for="sd">Date</label><input type="date" id="sd" data-in="sessDate" value="${esc(s.date)}"></div>
    </div>
    ${s.type === 'match' ? `<div class="three" style="margin-top:10px">
      <div><label for="sg">Elixir FC goals</label><input type="number" inputmode="numeric" id="sg" data-in="gf" value="${s.gf}"></div>
      <div style="text-align:center;padding-bottom:12px">-</div>
      <div><label for="sa">Their goals</label><input type="number" inputmode="numeric" id="sa" data-in="ga" value="${s.ga}"></div>
    </div>` : ''}
  </div>`;
}
/* The coach who started the session: attendance, timer, plan, notes, finish. */
function viewLead(s){
  const t = S.timer, b = s.blocks;
  const blkRows = b.map((x,i) => {
    const cls = t.done || i < t.idx ? 'past' : (i === t.idx ? 'now' : '');
    return `<div class="blk ${cls}">
      <button class="mark" style="border:0;padding:0;min-height:22px" aria-label="Jump to ${esc(x.name)}" data-act="jump" data-v="${i}"></button>
      <input type="text" data-in="blkName" data-i="${i}" value="${esc(x.name)}" aria-label="Block name">
      <input type="number" inputmode="numeric" data-in="blkMin" data-i="${i}" value="${x.min}" aria-label="Minutes">
      <button class="x" data-act="blkdel" data-v="${i}" aria-label="Remove block">&times;</button>
    </div>`;
  }).join('');
  const players = S.players.filter(p => !p.staff), staff = S.players.filter(p => p.staff);
  const row = p => {
    const m = s.marks[p.id];
    return `<div class="att"><div class="who"><b>${esc(p.name)}</b>${p.note ? `<span class="small muted">${esc(p.note)}</span>` : ''}${injBadge(p)}</div>
      <div class="seg3" role="group" aria-label="Attendance for ${esc(p.name)}">
        <button class="${m==='P'?'on P':''}" data-act="mark" data-id="${p.id}" data-v="P">Present</button>
        <button class="${m==='L'?'on L':''}" data-act="mark" data-id="${p.id}" data-v="L">Late</button>
        <button class="${m==='A'?'on A':''}" data-act="mark" data-id="${p.id}" data-v="A">Absent</button>
        <button class="${m==='E'?'on E':''}" data-act="mark" data-id="${p.id}" data-v="E">Injured</button>
      </div></div>`;
  };
  return `
  ${headerCard(s, true)}
  ${timerHTML(s)}
  <div class="card">
    <h2>Register</h2>
    ${countsHTML(s)}
    ${players.length ? players.map(row).join('') : '<div class="empty"><b>No players yet</b>The head coach adds the squad in the Squad tab.</div>'}
    ${staff.length ? `<div class="grp">Staff</div>` + staff.map(row).join('') : ''}
    <div style="height:10px"></div>
    <button class="btn" data-act="allpresent">Mark everyone unmarked as present</button>
    ${players.some(p => p.inj === 'I') ? '<div class="small muted" style="margin-top:6px">Players set as injured will be marked Injured.</div>' : ''}
  </div>
  ${s.type === 'match' ? matchSheetEdit(s) : ''}
  <div class="card">
    <h2>Session plan</h2>
    <div class="muted small" style="margin-bottom:6px">Edit names and minutes. Changes carry over to your next session.</div>
    ${blkRows}
    <div style="height:8px"></div>
    <button class="btn small" data-act="blkadd">Add block</button>
  </div>
  <div class="card">
    <label for="nt">Session notes</label>
    <textarea id="nt" data-in="notes" placeholder="What worked, who stood out, what to fix next time">${esc(s.notes)}</textarea>
    <div style="height:10px"></div>
    <div class="muted small" style="margin-bottom:8px">When you finish, you and the other coach can each give your scores.</div>
    <button class="btn primary" style="width:100%" data-act="end">Finish session</button>
  </div>`;
}
/* The other coach: watches the register, can use the timer, cannot mark or finish. */
function viewJoin(s){
  const players = S.players.filter(p => !p.staff);
  const word = {P:'Present', L:'Late', A:'Absent', E:'Injured'};
  const row = p => { const m = s.marks[p.id]; return `<div class="att"><div class="who"><b>${esc(p.name)}</b></div>${m ? `<span class="chip ${m}" style="min-width:84px">${word[m]}</span>` : '<span class="small muted">not marked yet</span>'}</div>`; };
  return `
  ${headerCard(s, false)}
  <div class="card">
    <b>You have joined this session.</b>
    <div class="small muted" style="margin:4px 0 10px">${leadLabel(s).replace(/^./, c => c.toUpperCase())} is taking attendance and will finish the session. You can watch the register and use your own timer. When it is finished you can give your scores.</div>
    <div class="row wrap-r">
      <button class="btn grow" data-act="leave">Leave session</button>
      ${isHead() ? `<button class="btn grow danger ${ui.armed==='tk'+s.id?'armed':''}" data-act="takeover" data-id="${s.id}">${ui.armed==='tk'+s.id ? 'Tap again to take over' : 'Take over as lead'}</button>` : ''}
    </div>
  </div>
  ${timerHTML(s)}
  <div class="card">
    <h2>Register</h2>
    ${countsHTML(s)}
    ${players.length ? players.map(row).join('') : '<div class="empty"><b>No players yet</b></div>'}
  </div>
  ${matchSummaryHTML(s)}`;
}
/* After the session is finished: both coaches give their own score. */
/* who the coaches score: present or late; in a match only players who were used (started or came on) */
function scorable(s){
  return S.players.filter(p => !p.staff && (s.marks[p.id] === 'P' || s.marks[p.id] === 'L') && (s.type !== 'match' || playedMatch(s, p.id)));
}
function viewScoring(s){
  const lead = isLead(s);
  const present = scorable(s);
  const scoreRow = p => `<div class="att"><div class="who"><b>${esc(p.name)}</b><span class="small muted">${s.marks[p.id] === 'L' ? 'Late' : 'Present'}</span></div><div>${ratingSel(s, p)}${unlockBtn(s, p)}</div></div>`;
  return `
  ${headerCard(s, lead)}
  ${s.type === 'match' ? (lead ? matchSheetEdit(s) : matchSummaryHTML(s)) : ''}
  <div class="card">
    <h2>Give your scores</h2>
    <div class="muted small" style="margin-bottom:8px">${s.type === 'match' ? 'Only players who started or came on are listed. ' : ''}Score each player from 1 to 10. Your score is yours alone; the average of both coaches' scores is what the players see.</div>
    ${present.length ? present.map(scoreRow).join('') : `<div class="empty"><b>No players to score</b>${s.type === 'match' ? 'Mark who started or came on in the match sheet above. Unused players are not scored.' : 'Nobody was marked present or late.'}</div>`}
  </div>
  <div class="card">
    ${lead ? `<label for="nt">Session notes</label><textarea id="nt" data-in="notes" placeholder="What worked, who stood out, what to fix next time">${esc(s.notes)}</textarea><div style="height:10px"></div>` : (s.notes && s.notes.trim() ? `<b>Notes</b><div class="small" style="margin:4px 0 10px">${esc(s.notes).replace(/\n/g,'<br>')}</div>` : '')}
    <div class="row wrap-r">
      <button class="btn grow" data-act="copycur">Copy summary</button>
      ${lead ? `<button class="btn grow" data-act="editatt" data-id="${s.id}">Edit attendance</button>` : ''}
    </div>
    <div style="height:8px"></div>
    <button class="btn primary" style="width:100%" data-act="leave">Done</button>
  </div>`;
}
function viewTrain(){
  const s = cur();
  if(!s) return viewStart();
  if(isFinished(s)) return viewScoring(s);
  return isLead(s) ? viewLead(s) : viewJoin(s);
}

  <div class="small muted" style="padding:0 4px">Tap a player to see their profile. Training attendance: present counts as 1, late counts as half (0.5) and absent counts as 0. Sessions where a player was left unmarked or marked Injured are ignored.</div>`;

function viewLog(){

    return `<div class="card">

function newCode(){
  const A = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  for(let tries = 0; tries < 20; tries++){
    const b = new Uint8Array(10); crypto.getRandomValues(b);
    const c = Array.from(b, x => A[x % A.length]).join('');
    if(!S.players.some(p => p.code === c)) return c;
  }
  return Math.random().toString(36).slice(2, 12).toUpperCase();
}

function resizePhoto(file, N){
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      try{
        const c = document.createElement('canvas'); c.width = N; c.height = N;
        const side = Math.min(img.naturalWidth, img.naturalHeight);
        c.getContext('2d').drawImage(img, (img.naturalWidth - side)/2, (img.naturalHeight - side)/2, side, side, 0, 0, N, N);
        URL.revokeObjectURL(url); resolve(c.toDataURL('image/jpeg', 0.75));
      }catch(err){ URL.revokeObjectURL(url); reject(err); }
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('read')); };
    img.src = url;
  });
}

function statsOf(pid){

    const pm = pubMatches();

      t.m++; t.list.push({d: s.date, o: s.opp || '', gf: num(s.gf), ga: num(s.ga), st: false, sb: false, g: 0, a: 0, y: 0, r: 0});

/* ---------- stickers, photos and videos in chat ----------
   A sticker, photo or video is sent as a short code in the message text, for example ~s:goal~ or ~i:ab12cd34ef56~.
   The chat functions on the server therefore need no changes. The picture or video itself lives in Supabase Storage. */
const STICKERS = [['goal','\u26BD','Goal!'],['nice','\uD83D\uDC4F','Nice one'],['fire','\uD83D\uDD25','On fire'],['strong','\uD83D\uDCAA','Strong'],['star','\u2B50','Star'],['trophy','\uD83C\uDFC6','Champions'],
  ['thumbs','\uD83D\uDC4D','Good'],['haha','\uD83D\uDE02','Haha'],['wow','\uD83D\uDE2E','Wow'],['sad','\uD83D\uDE22','Unlucky'],['love','\u2764\uFE0F','Love it'],['boots','\uD83D\uDC5F','Boots on'],
  ['gloves','\uD83E\uDDE4','Safe hands'],['horn','\uD83D\uDCE3','Lets go'],['gold','\uD83E\uDD47','Number one'],['sorry','\uD83D\uDE4F','Sorry'],['cool','\uD83D\uDE0E','Cool'],['team','\uD83E\uDD1D','Team']];
const MEDIA_RE = /^~([isv]):([a-z0-9]{4,24})~$/;
const MAX_VIDEO_BYTES = 25 * 1024 * 1024, MAX_VIDEO_SEC = 60;
/* A reply that the server cannot store itself is sent as a short code in front of the text, for example ~q:k3~ (k3 = the message number in base 36). */
const REPLY_RE = /^~q:([a-z0-9]{1,8})~/;
function splitReply(body){ const b = String(body || ''), m = REPLY_RE.exec(b); return m ? {qid: parseInt(m[1], 36), text: b.slice(m[0].length)} : {qid: null, text: b}; }
const withReply = (body, rid) => rid ? '~q:' + Number(rid).toString(36) + '~' + body : body;
const mediaOf = body => { const m = MEDIA_RE.exec(splitReply(body).text.trim()); return m ? {kind: m[1], id: m[2]} : null; };
const mediaUrl = id => SUPABASE_URL + '/storage/v1/object/public/chat-media/' + id;
function bodyPreview(body){ const m = mediaOf(body); return !m ? splitReply(body).text : m.kind === 'i' ? 'Photo' : m.kind === 'v' ? 'Video' : 'Sticker'; }
function bodyHTML(body){
  const m = mediaOf(body);
  if(!m) return `<div class="mb">${esc(splitReply(body).text)}</div>`;
  if(m.kind === 's'){ const s = STICKERS.find(x => x[0] === m.id); return s ? `<div class="stk" role="img" aria-label="Sticker: ${esc(s[2])}"><b>${s[1]}</b><span>${esc(s[2])}</span></div>` : '<div class="mb">Sticker</div>'; }
  const u = esc(mediaUrl(m.id));
  if(m.kind === 'i') return `<button class="avbtn" data-act="chmedia" data-u="${u}" aria-label="Open photo"><img class="cmedia" src="${u}" loading="lazy" alt="Photo in chat"></button>`;
  return `<video class="cmedia cvid" src="${u}" controls playsinline preload="metadata" aria-label="Video in chat"></video>`;
}
function showLightbox(u){
  if(!String(u || '').startsWith(SUPABASE_URL + '/storage/')) return;
  const d = document.createElement('div'); d.className = 'lightbox'; d.setAttribute('data-act', 'chlbx'); d.setAttribute('role', 'dialog'); d.setAttribute('aria-label', 'Photo. Tap to close');
  const i = document.createElement('img'); i.src = u; i.alt = 'Photo'; d.appendChild(i); document.body.appendChild(d);
}
function newMediaId(){ const b = new Uint8Array(12); crypto.getRandomValues(b); return Array.from(b, x => (x % 36).toString(36)).join(''); }
function shrinkImage(file, maxSide){
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      try{
        const sc = Math.min(1, maxSide / Math.max(img.naturalWidth, img.naturalHeight));
        const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(img.naturalWidth * sc)); c.height = Math.max(1, Math.round(img.naturalHeight * sc));
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        c.toBlob(b => b ? resolve(b) : reject(new Error('blob')), 'image/jpeg', 0.8);
      }catch(err){ URL.revokeObjectURL(url); reject(err); }
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('read')); };
    img.src = url;
  });
}
function videoLength(file){
  return new Promise(resolve => {
    const v = document.createElement('video'), url = URL.createObjectURL(file); let done = false;
    const fin = d => { if(done) return; done = true; URL.revokeObjectURL(url); resolve(d); };
    v.preload = 'metadata'; v.onloadedmetadata = () => fin(v.duration); v.onerror = () => fin(null); v.src = url; setTimeout(() => fin(null), 4000);
  });
}
function mediaClient(){
  if(mode === 'coach') return sb;
  if(!mediaClient.c || mediaClient.code !== pcode){
    mediaClient.c = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {global: {headers: {'x-player-code': pcode}}, auth: {persistSession: false, autoRefreshToken: false, detectSessionInUrl: false}});
    mediaClient.code = pcode;
  }
  return mediaClient.c;
}
async function chatAttach(file){
  if(!sb || ui.chUp || ui.chBusy) return;
  const isVid = /^video\//.test(file.type), isImg = /^image\//.test(file.type);
  if(!isVid && !isImg){ toast('Choose a photo or a video'); return; }
  if(isVid && file.size > MAX_VIDEO_BYTES){ toast('That video is too big. Keep it under 25 MB, about 30 seconds.'); return; }
  ui.chUp = true; toast(isVid ? 'Sending video...' : 'Sending photo...');
  try{
    if(isVid){ const d = await videoLength(file); if(d && d > MAX_VIDEO_SEC + 1){ ui.chUp = false; toast('Videos can be up to 60 seconds'); return; } }
    const blob = isVid ? file : await shrinkImage(file, 1280);
    const id = newMediaId();
    const {error} = await mediaClient().storage.from('chat-media').upload(id, blob, {contentType: isVid ? (file.type || 'video/mp4') : 'image/jpeg', cacheControl: '31536000', upsert: false});
    ui.chUp = false;
    if(error){ toast('Could not upload. Photos and videos may not be switched on yet.'); return; }
    await chatSend('~' + (isVid ? 'v' : 'i') + ':' + id + '~');
  }catch(e){ ui.chUp = false; toast('Could not send that file'); }
}

function teamEntries(){
  const ro = pr.roster, ppl = pr.people || {}, me = pdata && pdata.player;

  const photo = id => me && String(me.id) === String(id) ? (me.photo || '') : ((ppl[String(id)] || {}).photo || rp[String(id)] || '');
  const out = [];
  if(ro && Array.isArray(ro.players)){
    const nk = n => String(n || '').trim().toLowerCase();
    const staffBy = {}; ro.players.forEach(p => { if(p.staff) staffBy[nk(p.name)] = p; });
    const coachNames = new Set();
    (ro.coaches || []).forEach(c => {
      let ph = photo(c.id); const sp = staffBy[nk(c.name)]; if(!ph && sp) ph = photo(sp.id);
      coachNames.add(nk(c.name || 'Coach'));
      out.push({id: c.id, name: c.name || 'Coach', photo: ph, title: c.title, group: c.title === 'Coach' ? 'coach' : 'assistant', auth: true});
    });
    ro.players.forEach(p => {
      if(p.id === '_matches') return;
      if(p.staff && coachNames.has(nk(p.name))) return;
      const title = p.staff ? (ROLE_TITLE[p.role] || 'Staff') : '';
      out.push({id: p.id, name: p.name, photo: photo(p.id), title, pos: p.pos, num: p.num, age: p.age, foot: p.foot, group: !p.staff ? 'player' : p.role === 'coach' ? 'coach' : 'assistant'});
    });
  }else{
    Object.keys(ppl).forEach(id => { const q = ppl[id], c = q.kind === 'coach'; if(!q.name) return; out.push({id, name: q.name, photo: q.photo || '', title: c ? 'Coach' : '', group: c ? 'coach' : 'player', thin: true}); });
  }
  return out;
}

/* ====================== rankings (shared by coach and player) ====================== */
/* Each session scores out of 100; the ranking score is the average of the sessions.
   Training = wForm * coach score + wAtt * attendance. Match = wMatchScore * coach score + wMatchAtt * attendance. */
const RANK = {wForm: 0.5, wAtt: 0.5, wMatchScore: 0.7, wMatchAtt: 0.3, minRated: 3, minRatedMonth: 2};

function rankStats(p, sess){
  /* Every session gets its own score out of 100, and the ranking score is the average of them.
     Training: 50% coach score + 50% attendance. Match: 70% coach score + 30% attendance.
     A player who came to a match but was not used is not marked down for it: that match is left out of his average (it still counts as a session attended). Injured sessions are not counted. */
  let total = 0, att = 0, came = 0, late = 0, sum = 0, counted = 0, bsum = 0, bn = 0; const rated = [];
  sess.forEach(s => {
    const m = s.marks && s.marks[p.id];
    const isMatch = s.type === 'match';
    const used = !isMatch || playedMatch(s, p.id);
    const r = used && s.ratings && s.ratings[p.id] ? Number(s.ratings[p.id]) : null;
    if(r) rated.push(r);
    let a = null;
    if(m && m !== 'E'){ total++; a = m === 'P' ? 1 : m === 'L' ? 0.5 : 0; att += a; if(a > 0){ came++; if(m === 'L') late++; } }
    if(a === null) return;
    const wS = isMatch ? RANK.wMatchScore : RANK.wForm, wA = isMatch ? RANK.wMatchAtt : RANK.wAtt;
    if(r){ sum += wS * r * 10 + wA * a * 100; counted++; }
    else if(isMatch && !used){ bsum += wA * a * 100; bn++; }   // bench: does not pull the average down
    else if(a === 0){ counted++; }
  });
  const last = rated.slice(0, 5);
  const avg = last.length ? last.reduce((a, x) => a + x, 0) / last.length : null;
  const attPct = total ? att / total * 100 : null;
  const score = counted ? Math.round(sum / counted * 10) / 10 : (bn ? Math.round(bsum / bn * 10) / 10 : null);
  return {id: p.id, name: p.name, photo: p.photo, pos: p.pos || '', avg, att: attPct, total, nrated: rated.length, counted: counted + bn, score, latest: rated.length ? rated[0] : null, came, late};
}
/* Tie-breaks, in order. Nothing is decided by the alphabet. If two players are level on every step, a fixed random draw
   (same result every time for the same period) decides, so nobody has to choose. */
const RANK_STEPS = [
  {k: 'score', label: 'score', best: 'high'}, {k: 'avg', label: 'form', best: 'high'}, {k: 'att', label: 'attendance', best: 'high'},
  {k: 'latest', label: 'latest session score', best: 'high'}, {k: 'came', label: 'sessions attended', best: 'high'},
  {k: 'late', label: 'fewer late arrivals', best: 'low'}, {k: 'nrated', label: 'more scored sessions', best: 'high'}
];
function drawKey(id, seed){ let h = 2166136261; const t = seed + '|' + id; for(let i = 0; i < t.length; i++){ h ^= t.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function rankCmp(seed){
  return (a, b) => {
    for(const st of RANK_STEPS){ const x = a[st.k] || 0, y = b[st.k] || 0; if(Math.abs(x - y) > 1e-9) return st.best === 'high' ? y - x : x - y; }
    return drawKey(a.id, seed) - drawKey(b.id, seed) || String(a.id).localeCompare(String(b.id));
  };
}
function tieReason(a, b){
  for(const st of RANK_STEPS){ const x = a[st.k] || 0, y = b[st.k] || 0; if(Math.abs(x - y) > 1e-9) return st.label; }
  return 'a random draw';
}
/* Tied ranking: same score = same rank (1, 2, 2, 4). Nothing breaks a tie. */
function assignRanks(list){
  let prev = null, pos = 0;
  list.forEach((x, i) => { if(prev === null || Math.abs(x.score - prev) > 1e-9){ pos = i + 1; prev = x.score; } x.rank = pos; });
  list.forEach(x => { x.tied = list.some(y => y !== x && y.rank === x.rank); });
  return list;
}
function rankList(from, to, minRated){
  const sess = S.sessions.filter(s => s.finished !== false && (!from || s.date >= from) && (!to || s.date <= to))
    .sort((a, b) => (b.date + b.id).localeCompare(a.date + a.id));
  const all = S.players.filter(p => !p.staff).map(p => rankStats(p, sess));
  const ranked = all.filter(x => x.score !== null && x.counted >= minRated)
    .sort((a, b) => (b.score - a.score) || String(a.name).localeCompare(String(b.name)));
  assignRanks(ranked);
  const unranked = all.filter(x => !ranked.includes(x)).sort((a, b) => a.name.localeCompare(b.name));
  return {ranked, unranked};
}
const monthLabel = ym => { const [y, m] = String(ym).split('-').map(Number); return new Date(y, (m || 1) - 1, 1).toLocaleDateString('en-GB', {month: 'long', year: 'numeric'}); };
function monthKeys(n){
  const d = new Date(), out = [];
  for(let i = 0; i < n; i++){ const x = new Date(d.getFullYear(), d.getMonth() - i, 1); out.push(x.getFullYear() + '-' + String(x.getMonth() + 1).padStart(2, '0')); }
  return out;
}

  if(per === 'month'){ const ym = todayStr().slice(0, 7); return {from: ym + '-01', to: ym + '-31', min: RANK.minRatedMonth, label: monthLabel(ym)}; }
  return {from: null, to: null, min: RANK.minRated, label: 'All time'};
}

  const seg = `<div class="tog" role="group" aria-label="Period"><button class="btn ${per === 'all' ? 'on' : ''}" data-act="rkp" data-v="all" aria-pressed="${per === 'all'}">All time</button><button class="btn ${per === 'month' ? 'on' : ''}" data-act="rkp" data-v="month" aria-pressed="${per === 'month'}">This month</button></div>`;
