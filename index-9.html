  const row = (x, i) => `<div class="rk ${x.rank === 1 ? 'first' : ''}"><span class="pos" aria-label="Rank ${x.rank}">${x.rank}</span><button class="rkbtn" data-act="profile" data-id="${x.id}" aria-label="Open profile of ${esc(x.name)}">${avatar(x, 40)}<span class="info"><b>${esc(x.name)}${x.tied ? ' <span class="pill E">Tied</span>' : ''}</b><span class="small muted">${x.avg == null ? 'No coach score yet' : 'Form ' + x.avg.toFixed(1)}, attendance ${Math.round(x.att || 0)}%, ${x.counted} sessions</span></span></button><span class="sc">${x.score}</span></div>`;
  const why = x => x.score === null
    ? (x.total === 0 ? 'No attendance yet' : 'Waiting for the first score')
    : 'Needs ' + (info.min - x.counted) + ' more ' + (info.min - x.counted === 1 ? 'session' : 'sessions');
  if(rv === 'scorers') return viewSeg + seg + scorersCard(info);
  return `${viewSeg}${seg}
  <div class="card"><div class="row" style="margin-bottom:6px"><h2 class="grow" style="margin:0">Ranking: ${esc(info.label)}</h2>${ranked.length || unranked.length ? '<button class="btn small" data-act="rkdl">Download CSV</button>' : ''}</div>
    ${ranked.length ? ranked.map(row).join('') : `<div class="empty" style="padding:10px"><b>Nobody is ranked yet</b>Players appear here after their first scored session (training or match) in this period.</div>`}
  </div>
  ${unranked.length ? `<div class="card"><h2>Not ranked yet <span class="muted small">${unranked.length}</span></h2>${unranked.map(x => `<div class="pl">${avatar(x, 36)}<button class="plbtn" data-act="profile" data-id="${x.id}"><b>${esc(x.name)}</b><div class="small muted">${esc(why(x))}</div></button></div>`).join('')}</div>` : ''}
  <div class="small muted" style="padding:0 4px">Every session gets a score out of 100 and the ranking score is the average of them. Training = ${Math.round(RANK.wForm * 100)}% coach score + ${Math.round(RANK.wAtt * 100)}% attendance. Match = ${Math.round(RANK.wMatchScore * 100)}% coach score + ${Math.round(RANK.wMatchAtt * 100)}% attendance. A player who came to a match but was not used is not marked down: that match is left out of his average. Absent = 0. Injured sessions are not counted. Form is the average of the last 5 coach scores. Players on the same score share the same rank (for example 1, 2, 2, 4). Nothing breaks a tie. Players see the top 10, including anyone tied for 10th. Everyone tied inside the top 3 goes on the Player of the Month ballot. The download opens in Excel or Google Sheets.</div>`;
}
function downloadRanks(){
  const per = ui.rkPeriod || 'all', info = periodInfo(per);
  const {ranked, unranked} = rankList(info.from, info.to, info.min);
  const rows = [['Rank', 'Name', 'Position', 'Score (out of 100)', 'Form (average of last 5 scores, out of 10)', 'Attendance % (training and matches)', 'Sessions counted', 'Scored sessions', 'Period']];
  ranked.forEach((x, i) => rows.push([x.rank, x.name, x.pos, x.score, round1(x.avg), Math.round(x.att), x.total, x.nrated, info.label]));
  unranked.forEach(x => rows.push(['', x.name, x.pos, '', x.avg == null ? '' : round1(x.avg), x.att == null ? '' : Math.round(x.att), x.total, x.nrated, info.label + ' (not ranked yet)']));
  downloadText('elixir-fc-rankings-' + (per === 'month' ? todayStr().slice(0, 7) : 'all-time') + '.csv', '\ufeff' + rows.map(r => r.map(csvCell).join(',')).join('\r\n'));
  toast('Ranking downloaded');
}

/* ---------- coach: Player of the Month ---------- */
let potmC = {loaded: false, error: false, rounds: [], cur: null, votes: {}, n: 0};
async function loadPotmCoach(){
  if(!sb || !clubId) return;
  try{
    const r = await sb.from('potm_rounds').select('id,month,status,candidates,winner_id,created_at').eq('club_id', clubId).order('created_at', {ascending: false}).limit(24);
    if(r.error) throw r.error;
    const rounds = r.data || [];
    const cur = rounds.find(x => x.status === 'open') || rounds[0] || null;
    const votes = {}; let n = 0;
    if(cur){
      const v = await sb.from('potm_votes').select('candidate_id').eq('round_id', cur.id);
      (v.data || []).forEach(x => { votes[x.candidate_id] = (votes[x.candidate_id] || 0) + 1; n++; });
    }
    potmC = {loaded: true, error: false, rounds, cur, votes, n};
  }catch(e){ potmC = {loaded: true, error: true, rounds: [], cur: null, votes: {}, n: 0}; }
  render();
}
function candRow(c, votes, total){
  const p = S.players.find(x => x.id === c.id) || {name: c.name};
  return `<div class="cand">${avatar(p, 48)}<div class="grow" style="min-width:0"><b>${esc(p.name || c.name)}</b><div class="small muted">Score ${esc(c.score)}, form ${esc(Number(c.form).toFixed(1))}, attendance ${esc(c.att)}%</div>${votes === null ? '' : `<div class="bar"><i style="width:${total ? Math.round(votes / total * 100) : 0}%"></i></div>`}</div>${votes === null ? '' : `<span class="chip ${votes ? 'hi' : 'E'}" style="min-width:auto">${votes} ${votes === 1 ? 'vote' : 'votes'}</span>`}</div>`;
}
function viewAwards(){
  const d = potmC, head = isHead();
  if(!d.loaded) return '<div class="empty">Loading...</div>';
  if(d.error) return `<div class="card"><div class="empty"><b>Awards are not set up yet</b>Run the file elixir_upgrade.sql in Supabase (SQL Editor), then come back here.</div><button class="btn" style="width:100%" data-act="potmreload">Try again</button></div>`;
  const cur = d.cur, players = S.players.filter(p => !p.staff).length;
  let main = '';
  if(cur && cur.status === 'open'){
    const cands = cur.candidates || [];
    main = `<div class="card"><h2>Voting is open: ${esc(monthLabel(cur.month))}</h2>
      <div class="small muted">${d.n} of ${players} players have voted. Players cannot see the totals.</div>
      ${cands.map(c => candRow(c, d.votes[c.id] || 0, d.n)).join('')}
      ${head ? `<div class="two" style="margin-top:12px"><button class="btn danger ${ui.armed === 'pcancel' ? 'armed' : ''}" data-act="potmcancel">${ui.armed === 'pcancel' ? 'Tap again to cancel' : 'Cancel voting'}</button><button class="btn primary ${ui.armed === 'pclose' ? 'armed' : ''}" data-act="potmclose">${ui.armed === 'pclose' ? 'Tap again to confirm' : 'Close and pick winner'}</button></div><div class="small muted" style="margin-top:8px">Closing picks the player with the most votes. If votes are tied, the higher score wins, then a random draw.</div>` : '<div class="small muted" style="margin-top:8px">Only the head coach can close voting.</div>'}
    </div>`;
  }else{
    if(cur){
      const w = (cur.candidates || []).find(c => c.id === cur.winner_id);
      main += `<div class="winner"><div class="wm">Player of the Month, ${esc(monthLabel(cur.month))}</div>${w ? avatar(S.players.find(p => p.id === w.id) || {name: w.name}, 84) : ''}<div class="wn">${esc(w ? w.name : 'No winner')}</div></div>`;
    }
    if(head){
      const months = monthKeys(4), sel = ui.pmMonth && months.includes(ui.pmMonth) ? ui.pmMonth : months[0];
      const done = d.rounds.some(r => r.month === sel);
      const rl = rankList(sel + '-01', sel + '-31', RANK.minRatedMonth).ranked, top = rl.filter(x => x.rank <= 3);
      const can = !done && top.length >= 2;
      const cutNote = !done && top.length > 3 ? `<div class="note">${top.length} players are on the ballot because some scores are tied. Everyone on a tied score goes on the ballot.</div>` : '';
      main += `<div class="card"><h2>Start a vote</h2>
        <label for="pmsel">Month</label>
        <select id="pmsel" data-in="pmonth" style="width:100%;min-height:44px">${months.map(m => `<option value="${m}" ${m === sel ? 'selected' : ''}>${esc(monthLabel(m))}</option>`).join('')}</select>
        <div class="small muted" style="margin:10px 0 2px">${done ? 'Voting already ran for this month.' : top.length >= 2 ? 'These top ' + top.length + ' players go on the ballot:' : 'Needs at least 2 players with ' + RANK.minRatedMonth + ' scored sessions this month.'}</div>
        ${!done && top.length >= 2 ? top.map(x => candRow({id: x.id, name: x.name, score: x.score, form: x.avg, att: Math.round(x.att)}, null, 0)).join('') : ''}
        ${cutNote}
        <button class="btn primary" style="width:100%;margin-top:10px" data-act="potmopen" ${can ? '' : 'disabled'}>Open voting for ${esc(monthLabel(sel))}</button>
      </div>`;
    }else if(!cur){
      main += '<div class="card"><div class="empty"><b>No vote yet</b>The head coach opens voting each month.</div></div>';
    }
  }
  const past = d.rounds.filter(r => r.status === 'closed' && r.winner_id);
  const hist = past.length ? `<div class="card"><h2>Past winners</h2>${past.map(r => { const w = (r.candidates || []).find(c => c.id === r.winner_id); return `<div class="hrow" style="cursor:default;min-height:44px"><span class="grow">${esc(monthLabel(r.month))}</span><b>${esc(w ? w.name : '')}</b></div>`; }).join('')}</div>` : '';
  return main + hist;
}
async function potmOpen(){
  const months = monthKeys(4), m = ui.pmMonth && months.includes(ui.pmMonth) ? ui.pmMonth : months[0];
  const {ranked} = rankList(m + '-01', m + '-31', RANK.minRatedMonth);
  if(ranked.length < 2){ toast('Needs at least 2 ranked players in ' + monthLabel(m)); return; }
  const cands = ranked.filter(x => x.rank <= 3).map(x => ({id: x.id, name: x.name, score: x.score, form: round1(x.avg || 0), att: Math.round(x.att || 0)}));
  const {error} = await sb.from('potm_rounds').insert({club_id: clubId, month: m, status: 'open', candidates: cands});
  if(error){ toast(error.code === '23505' ? 'Voting already ran for that month, or another vote is open' : 'Could not open voting. Check the SQL setup.'); return; }
  toast('Voting is open'); loadPotmCoach();
}
async function potmClose(){
  const r = potmC.cur; if(!r || r.status !== 'open') return;
  if(!potmC.n){ toast('Nobody has voted yet'); return; }
  if(!arm('pclose')) return;
  ui.armed = null;
  let bv = -1;
  (r.candidates || []).forEach(c => { const v = potmC.votes[c.id] || 0; if(v > bv) bv = v; });
  const tiedC = (r.candidates || []).filter(c => (potmC.votes[c.id] || 0) === bv);
  tiedC.sort((a, b) => (Number(b.score) || 0) - (Number(a.score) || 0) || drawKey(a.id, r.month) - drawKey(b.id, r.month));
  const best = tiedC[0]; if(!best) return;
  let tieNote = '';
  if(tiedC.length > 1) tieNote = '. Tied on votes, decided by ' + (Math.abs((Number(tiedC[0].score) || 0) - (Number(tiedC[1].score) || 0)) > 1e-9 ? 'the higher score' : 'a random draw');
  const {data, error} = await sb.from('potm_rounds').update({status: 'closed', winner_id: best.id, closed_at: new Date().toISOString()}).eq('id', r.id).eq('status', 'open').select('id');
  if(error || !data || !data.length){ toast('Could not close voting. Try again.'); return; }
  toast(best.name + ' is Player of the Month' + tieNote); loadPotmCoach();
}
async function potmCancel(){
  const r = potmC.cur; if(!r || r.status !== 'open') return;
  if(!arm('pcancel')) return;
  ui.armed = null;
  const {error} = await sb.from('potm_rounds').delete().eq('id', r.id).eq('status', 'open');
  if(error){ toast('Could not cancel. Try again.'); return; }
  toast('Voting cancelled'); loadPotmCoach();
}

/* ---------- coach: chat moderation ---------- */
let chatC = {loaded: false, error: false, messages: [], reports: {}, frozen: false, muted: [], sig: ''};
const activeIsChat = () => !!(document.activeElement && document.activeElement.id === 'chin');
async function loadCoachChat(quiet){
  if(!sb || !clubId) return;
  try{
    const base = 'id,sender_id,sender_name,by_coach,body,created_at';
    const q = cols => sb.from('chat_messages').select(cols).eq('club_id', clubId).eq('deleted', false).order('id', {ascending: false}).limit(100);
    let noReply = !!chatC.noReply;
    let m = await q(noReply ? base : base + ',reply_to');
    if(m.error && !noReply){ noReply = true; m = await q(base); }
    if(m.error) throw m.error;
    const [s, rp] = await Promise.all([
      sb.from('chat_settings').select('frozen,muted,dm_off').eq('club_id', clubId).maybeSingle(),
      sb.from('chat_reports').select('message_id').eq('club_id', clubId)
    ]);
    let dmCol = !s.error;
    if(s.error){ const s2 = await sb.from('chat_settings').select('frozen,muted').eq('club_id', clubId).maybeSingle(); s.data = s2.data; }
    const reports = {}; (rp.data || []).forEach(x => { reports[x.message_id] = (reports[x.message_id] || 0) + 1; });
    const next = {loaded: true, error: false, noReply, messages: m.data || [], reports, frozen: !!(s.data && s.data.frozen), muted: (s.data && s.data.muted) || [], dmCol, dmOff: !!(s.data && s.data.dm_off)};
    next.sig = JSON.stringify([next.messages.map(x => x.id), next.frozen, next.muted, reports]);
    const changed = next.sig !== chatC.sig; chatC = next;
    if(quiet){ if(changed){ if(activeIsChat()) paintChat(); else render(); } }
    else render();
  }catch(e){ chatC = {loaded: true, error: true, noReply: false, messages: [], reports: {}, frozen: false, muted: [], sig: ''}; if(!quiet) render(); }
}
function viewChatC(){
  const c = chatC, head = isHead();
  if(!c.loaded) return '<div class="empty">Loading...</div>';
  if(c.error) return `<div class="card"><div class="empty"><b>Chat is not set up yet</b>Run the file elixir_upgrade.sql in Supabase (SQL Editor), then come back here.</div><button class="btn" style="width:100%" data-act="chreload">Try again</button></div>`;
  const mutedList = c.muted.map(id => { const p = S.players.find(x => x.id === id); return {id, name: p ? p.name : 'Unknown player'}; });
  const extra = `${head ? `<button class="btn ${c.frozen ? 'primary' : ''}" style="width:100%;margin-bottom:8px" data-act="chfreeze">${c.frozen ? 'Chat is paused. Tap to resume' : 'Pause chat for players'}</button>` : (c.frozen ? '<div class="note">The chat is paused by the head coach.</div>' : '')}
    ${mutedList.length ? `<div class="grp">Muted players</div>${mutedList.map(x => `<div class="row" style="padding:4px 0"><span class="grow">${esc(x.name)}</span>${head ? `<button class="btn small" data-act="chmute" data-pid="${esc(x.id)}">Unmute</button>` : ''}</div>`).join('')}` : ''}`;
  return chatShell({list: cChatList(), ph: 'Write to the team', extra, blurb: 'Players chat here. You can read everything, reply, delete messages, and (head coach) pause the chat or mute a player. Your messages show a Coach tag.'});
}
function cChatList(){
  const c = chatC, head = isHead(), byId = {};
  c.messages.forEach(x => { byId[x.id] = x; });
  const msgs = c.messages.map(m => {
    const rm = m.reply_to ? byId[m.reply_to] : null;
    return {id: m.id, sender_id: m.sender_id, name: m.sender_name, by_coach: !!m.by_coach, body: m.body, at: m.created_at, mine: !!user && m.sender_id === user.id,
      reply_to: m.reply_to, reply_name: rm ? rm.sender_name : null, reply_body: rm ? rm.body : null, reply_gone: !!(m.reply_to && !rm),
      reps: c.reports[m.id] || 0, muted: c.muted.includes(m.sender_id)};
  }).sort((a, b) => a.id - b.id);
  return chatListHTML(msgs, {coach: true, head, canReply: true});
}
async function chatDelete(id){
  if(!arm('cd' + id)) return;
  ui.armed = null;
  const {data, error} = await sb.from(ui.cmine ? 'coach_dm' : ui.cdm ? 'dm_messages' : 'chat_messages').update({deleted: true}).eq('id', id).select('id');
  if(error || !data || !data.length){ toast('Could not delete. Try again.'); return; }
  toast('Message deleted'); if(ui.cmine) loadCoachInbox(false); else if(ui.cdm) loadCoachDms(false); else loadCoachChat(false);
}
async function saveChatSettings(frozen, muted){
  const row = {club_id: clubId, frozen, muted}; if(chatC.dmCol) row.dm_off = !!chatC.dmOff;
  const {error} = await sb.from('chat_settings').upsert(row);
  if(error){ toast('Could not save. Try again.'); return false; }
  return true;
}
async function chatMute(pid){
  if(!pid) return;
  const muted = chatC.muted.includes(pid) ? chatC.muted.filter(x => x !== pid) : chatC.muted.concat(pid);
  if(await saveChatSettings(chatC.frozen, muted)){ toast(muted.includes(pid) ? 'Player muted' : 'Player unmuted'); loadCoachChat(false); }
}
async function chatFreeze(){
  const f = !chatC.frozen;
  if(await saveChatSettings(f, chatC.muted)){ toast(f ? 'Chat paused' : 'Chat resumed'); loadCoachChat(false); }
}


/* ---------- inbox: unread counts like WhatsApp ---------- */
const bdg = n => n > 99 ? '99+' : String(n);
const groupSeenKey = () => 'elixir-fc-group-seen-' + String(((pdata && pdata.player) || {}).id || '');
function groupSeenGet(){ try{ const v = localStorage.getItem(groupSeenKey()); return v == null ? null : Number(v); }catch(e){ return null; } }
function groupSeenSet(id){ try{ id = Number(id); if(!id) return; const c = groupSeenGet(); if(c != null && c >= id) return; localStorage.setItem(groupSeenKey(), String(id)); }catch(e){} }
const groupUnread = () => (pr.inbox ? Number(pr.inbox.group) || 0 : 0);
const dmUnreadOf = w => (pr.inbox && pr.inbox.dm ? Number(pr.inbox.dm[String(w)]) || 0 : 0);
const dmUnreadTotal = () => (pr.inbox && pr.inbox.dm ? Object.keys(pr.inbox.dm).reduce((a, k) => a + (Number(pr.inbox.dm[k]) || 0), 0) : 0);
const cdmSeenKey = id => 'c:' + id;
function cdmUnreadCount(){ const l = pr.cdmList; if(!Array.isArray(l)) return 0; const sn = dmSeen(); return l.filter(t => !t.last_mine && Number(t.last_id) > Number(sn[cdmSeenKey(t.coach)] || 0)).length; }
const privUnread = () => dmUnreadTotal() + cdmUnreadCount();
const inboxTotal = () => groupUnread() + privUnread();
function markGroupSeen(){
  const c = pr.chat; if(!c || !c.messages || !c.messages.length) return;
  groupSeenSet(Math.max.apply(null, c.messages.map(m => Number(m.id) || 0)));
  if(pr.inbox && pr.inbox.group > 0){ pr.inbox.group = 0; if(!activeIsChat()) render(); }
}
function clearDmBadge(w){ if(pr.inbox && pr.inbox.dm && pr.inbox.dm[String(w)] > 0){ pr.inbox.dm[String(w)] = 0; if(!activeIsChat()) render(); } }
const viewingGroup = () => mode === 'player' && ui.ptab === 'chat' && ui.chview !== 'dm' && ui.chview !== 'team';
async function loadInbox(quiet){
  if(mode !== 'player' || !pcode || pr.inboxDead) return;
  try{
    const {data, error} = await sb.rpc('inbox_counts', {p_code: pcode, p_group_seen: groupSeenGet(), p_dm_seen: dmSeen()});
    if(error){ if(missingFn(error)) pr.inboxDead = true; return; }
    if(!data) return;
    if(groupSeenGet() == null) groupSeenSet(data.group_max);
    const next = {group: Number(data.group) || 0, dm: data.dm || {}};
    if(viewingGroup()) next.group = 0;
    if(ui.ptab === 'chat' && ui.chview === 'dm' && ui.dmWith) next.dm[String(ui.dmWith)] = 0;
    const sig = JSON.stringify(next), changed = sig !== pr.inboxSig;
    pr.inboxSig = sig; pr.inbox = next;
    if(changed && mode === 'player' && !activeIsChat()) render();
  }catch(e){}
}
setInterval(() => { if(document.visibilityState === 'visible') loadInbox(true); }, 20000);
document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'visible') loadInbox(true); });

/* ---------- private chats (player side) ---------- */
const DM_SEEN_KEY = 'elixir-fc-dm-seen';
function dmSeen(){ try{ return JSON.parse(localStorage.getItem(DM_SEEN_KEY) || '{}') || {}; }catch(e){ return {}; } }
function dmMarkSeen(w, id){ try{ const s = dmSeen(); if(!id || Number(s[w] || 0) >= Number(id)) return; s[w] = Number(id); localStorage.setItem(DM_SEEN_KEY, JSON.stringify(s)); }catch(e){} }
function pDmUnread(){ const l = pr.dmList; if(!Array.isArray(l)) return false; const s = dmSeen(); return l.some(t => !t.last_mine && Number(t.last_id) > Number(s[t.with] || 0)); }
function dmNameOf(id){ const e = teamEntries().find(x => String(x.id) === String(id)); return e ? e.name : 'Player'; }
function dmEntryOf(id){ return teamEntries().find(x => String(x.id) === String(id)) || {id, name: 'Player', photo: ''}; }
async function loadCdmList(quiet){
  if(mode !== 'player' || !pcode || pr.cdmDead) return;
  try{
    const {data, error} = await sb.rpc('cdm_threads', {p_code: pcode});
    if(error){ if(missingFn(error)){ pr.cdmDead = true; pr.cdmList = []; } return; }
    const next = Array.isArray(data) ? data : [];
    const sig = JSON.stringify(next), changed = sig !== pr.cdmListSig; pr.cdmListSig = sig; pr.cdmList = next;
    if(mode === 'player' && changed && !(quiet && activeIsChat())) render();
  }catch(e){}
}
async function loadCdm(quiet){
  if(mode !== 'player' || !ui.dmCoach) return;
  const w = ui.dmCoach;
  try{
    const {data, error} = await sb.rpc('cdm_get', {p_code: pcode, p_coach: String(w)});
    if(w !== ui.dmCoach) return;
    if(error || !data){ if(error && missingFn(error)) pr.cdmDead = true; if(!quiet || pr.cdm === undefined){ pr.cdm = false; render(); } return; }
    const sig = JSON.stringify((data.messages || []).map(m => m.id));
    const changed = !pr.cdm || sig !== pr.cdmSig; pr.cdmSig = sig; pr.cdm = data;
    const last = (data.messages || []).slice(-1)[0]; if(last) dmMarkSeen(cdmSeenKey(w), last.id);
    if(!quiet || changed){ if(quiet && activeIsChat()) paintChat(); else render(); }
  }catch(e){ if(!quiet){ pr.cdm = false; render(); } }
}
function cdmMsgsHTML(){
  const d = pr.cdm;
  const ms = ((d && d.messages) || []).map(m => ({id: m.id, sender_id: m.sender_id, name: m.name, by_coach: !!m.by_coach, body: m.body, at: m.at, mine: !!m.mine}));
  return chatListHTML(ms, {canReply: !!d});
}
async function loadDmList(quiet){
  if(mode !== 'player' || !pcode) return;
  loadCdmList(true);
  pr.dmPollAt = Date.now();
  try{
    const {data, error} = await sb.rpc('dm_list', {p_code: pcode});
    const next = (error || !Array.isArray(data)) ? false : data;
    const sig = JSON.stringify(next);
    const changed = sig !== pr.dmListSig; pr.dmListSig = sig; pr.dmList = next;
    if(mode === 'player' && (!quiet || changed) && !(quiet && activeIsChat())) render();

let cmail = {loaded: false, error: false, msgs: [], sig: '', open: null};
const CM_SEEN_KEY = 'elixir-fc-coach-cm-seen';
function cmSeen(){ try{ return JSON.parse(localStorage.getItem(CM_SEEN_KEY) || '{}') || {}; }catch(e){ return {}; } }
function cmMarkSeen(key, id){ try{ const sn = cmSeen(); if(!id || Number(sn[key] || 0) >= Number(id)) return; sn[key] = Number(id); localStorage.setItem(CM_SEEN_KEY, JSON.stringify(sn)); }catch(e){} }
function cmThreads(){
  const th = {};
  cmail.msgs.forEach(m => { const k = m.player_id + '|' + m.coach_id; const t = th[k] = th[k] || {key: k, player: m.player_id, coach: m.coach_id, last: m}; if(m.id > t.last.id) t.last = m; });
  return Object.values(th).sort((a, b) => b.last.id - a.last.id);
}
function cmUnread(){ if(!user) return 0; const sn = cmSeen(); return cmThreads().filter(t => t.coach === user.id && !t.last.from_coach && Number(t.last.id) > Number(sn[t.key] || 0)).length; }
function cmMarkOpenSeen(){
  const t = cmail.open; if(!t) return;
  const ids = cmail.msgs.filter(x => x.player_id === t.player && x.coach_id === t.coach).map(x => x.id);
  if(ids.length) cmMarkSeen(t.player + '|' + t.coach, Math.max.apply(null, ids));
}

/* ---------- private chats (coach side: read, delete, switch off) ---------- */
let chatD = {loaded: false, error: false, msgs: [], reports: {}, open: null, sig: ''};
async function loadCoachDms(quiet){
  if(!sb || !clubId) return;
  try{
    const m = await sb.from('dm_messages').select('id,pair,sender_id,sender_name,to_id,body,created_at').eq('club_id', clubId).eq('deleted', false).order('id', {ascending: false}).limit(400);

    const reports = {}; (rp.data || []).forEach(x => { reports[x.message_id] = (reports[x.message_id] || 0) + 1; });
    const next = {loaded: true, error: false, msgs: m.data || [], reports, open: chatD.open, sig: ''};
    next.sig = JSON.stringify([next.msgs.map(x => x.id), reports]);
    const changed = next.sig !== chatD.sig; chatD = next;
    if(quiet){ if(changed){ if(activeIsChat()) paintChat(); else render(); } } else render();
  }catch(e){ chatD = {loaded: true, error: true, msgs: [], reports: {}, open: null, sig: ''}; if(!quiet) render(); }
}

/* ---------- chat sending (players and coaches) ---------- */
const CHAT_ERR = {frozen: 'The coaches have paused the chat', muted: 'You cannot send messages right now', slow: 'Slow down a little', filtered: 'Please keep it kind and clean', link: 'Links and phone numbers are not allowed', long: 'Messages can be up to 300 characters', empty: 'Type a message first', bad_code: 'Please log in again', dm_off: 'Private chats are switched off right now', bad_to: 'Could not find that player', self: 'You cannot message yourself'};
async function chatSend(override){
  const isOv = typeof override === 'string';
  const body = isOv ? override : String(ui.chDraft || '').trim().replace(/\s+/g, ' ');
  if(!body || ui.chBusy) return;
  const rid = ui.chReply ? Number(ui.chReply.id) : null;
  const coded = withReply(body, rid);
  if(coded.length > 300){ toast(CHAT_ERR.long); return; }
  ui.chBusy = true;
  try{
    if(mode === 'player' && ui.chview === 'dm' && ui.dmCoach){
      const r = await sb.rpc('cdm_send', {p_code: pcode, p_coach: String(ui.dmCoach), p_body: coded});
      ui.chBusy = false;
      if(r.error){ toast(missingFn(r.error) ? 'Messaging coaches is not switched on yet' : 'Could not send. Check your internet.'); return; }
      if(r.data === 'ok'){ if(!isOv) ui.chDraft = ''; ui.chReply = null; ui.chStick = true; await loadCdm(false); loadCdmList(true); }
      else toast(CHAT_ERR[r.data] || 'Could not send that message');
      return;
    }
    if(mode === 'player' && ui.chview === 'dm' && ui.dmWith){
      const r = await sb.rpc('dm_send', {p_code: pcode, p_to: ui.dmWith, p_body: coded});
      ui.chBusy = false;
      if(r.error){ toast('Could not send. Check your internet.'); return; }
      if(r.data === 'ok'){ if(!isOv) ui.chDraft = ''; ui.chReply = null; ui.chStick = true; await loadDm(false); }
      else toast(CHAT_ERR[r.data] || 'Could not send that message');
      return;
    }
    if(mode === 'player'){
      let res = pr.v2 === false ? await sb.rpc('chat_send', {p_code: pcode, p_body: coded}) : await sb.rpc('chat_send2', {p_code: pcode, p_body: body, p_reply_to: rid});
      if(pr.v2 !== false && missingFn(res.error)){ pr.v2 = false; res = await sb.rpc('chat_send', {p_code: pcode, p_body: coded}); }
      ui.chBusy = false;
      if(res.error){ toast('Could not send. Check your internet.'); return; }
      if(res.data === 'ok'){ if(!isOv) ui.chDraft = ''; ui.chReply = null; ui.chStick = true; await loadChat(false); }
      else toast(CHAT_ERR[res.data] || 'Could not send that message');
    }else if(mode === 'coach' && user && ui.cmine && cmail.open){
      const t = cmail.open;
      if(t.coach !== user.id){ ui.chBusy = false; toast('Only that coach can reply here'); return; }
      const {error} = await sb.from('coach_dm').insert({club_id: clubId, player_id: t.player, coach_id: user.id, from_coach: true, sender_name: coachChatName(), body: coded});
      ui.chBusy = false;
      if(error){ toast('Could not send. Try again.'); return; }
      if(!isOv) ui.chDraft = ''; ui.chReply = null; ui.chStick = true; await loadCoachInbox(false);
    }else if(mode === 'coach' && user){
      const row = {club_id: clubId, sender_id: user.id, sender_name: coachChatName(), by_coach: true, body};
      if(rid){ if(chatC.noReply) row.body = coded; else row.reply_to = rid; }
      let {error} = await sb.from('chat_messages').insert(row);
      if(error && row.reply_to){ delete row.reply_to; row.body = coded; ({error} = await sb.from('chat_messages').insert(row)); }
      ui.chBusy = false;
      if(error){ toast('Could not send. Try again.'); return; }
      if(!isOv) ui.chDraft = ''; ui.chReply = null; ui.chStick = true; await loadCoachChat(false);
    }else ui.chBusy = false;
  }catch(e){ ui.chBusy = false; toast('Could not connect. Check your internet.'); }
}

async function ensurePeople(){
  if(!pcode) return;
  if(pr.peopleAt && Date.now() - pr.peopleAt < 300000) return;
  pr.peopleAt = Date.now();
  let ok = false;
  if(!pr.peopleDead){
    try{
      const {data, error} = await sb.rpc('chat_people', {p_code: pcode});
      if(error && missingFn(error)) pr.peopleDead = true;
      else if(!error && Array.isArray(data)){
        const map = {}; data.forEach(x => { map[String(x.id)] = {name: x.name, photo: x.photo || '', kind: x.kind}; });
        pr.people = map; ok = true;
      }
    }catch(e){}
  }
  /* pictures of everyone in the squad, even people who have never written in the chat */
  if(!pr.photosDead){
    try{
      const r = await sb.rpc('roster_photos', {p_code: pcode});
      if(r.error){ if(missingFn(r.error)) pr.photosDead = true; }
      else if(Array.isArray(r.data)){
        pr.people = pr.people || {};
        r.data.forEach(x => { const k = String(x.id); const q = pr.people[k] || (pr.people[k] = {name: '', photo: '', kind: 'player'}); if(x.photo) q.photo = x.photo; });
        ok = true;
      }
    }catch(e){}
  }
  if(!ok){ pr.peopleAt = Date.now() - 240000; return; }
  if(mode !== 'player') return;
  if(ui.ptab === 'chat' && document.getElementById('chatlist')) paintChat();
  else if(ui.ptab === 'chat' || ui.ptab === 'squad') render();
}
async function loadChat(quiet){
  try{
    let r = pr.v2 === false ? null : await sb.rpc('chat_get2', {p_code: pcode});
    if(!r || missingFn(r.error) || (!r.error && !r.data)){ pr.v2 = false; r = await sb.rpc('chat_get', {p_code: pcode}); }
    else if(!r.error) pr.v2 = true;
    const {data, error} = r;
    if(error || !data){ if(!quiet || pr.chat === undefined){ pr.chat = false; if(mode === 'player') render(); } return; }
    const sig = JSON.stringify([(data.messages || []).map(m => m.id), data.frozen, data.muted]);
    const changed = sig !== pr.chatSig; pr.chatSig = sig; pr.chat = data;
    if(mode !== 'player') return;
    if(viewingGroup()) markGroupSeen();
    ensurePeople();
    if(!quiet || changed){ if(quiet && activeIsChat()) paintChat(); else render(); }
  }catch(e){ if(!quiet){ pr.chat = false; if(mode === 'player') render(); } }
}
function paintChat(){
  const el = document.getElementById('chatlist');
  if(el){ el.innerHTML = mode === 'player' ? (ui.chview === 'dm' && ui.dmCoach ? cdmMsgsHTML() : ui.chview === 'dm' && ui.dmWith ? dmMsgsHTML() : pChatList()) : (ui.cmine && cmail.open ? cMailList() : ui.cdm ? cDmList() : cChatList()); chatScrollFix(); } else render();
}
function chatPoll(){
  if(document.visibilityState !== 'visible') return;
  if(mode === 'player' && ui.ptab === 'chat'){
    if(ui.chview === 'dm'){ if(ui.dmCoach) loadCdm(true); else if(ui.dmWith) loadDm(true); else loadDmList(true); } else { loadChat(true); if(!pr.dmPollAt || Date.now() - pr.dmPollAt > 25000) loadDmList(true); }
  }else if(mode === 'player'){ if(!pr.dmPollAt || Date.now() - pr.dmPollAt > 28000) loadDmList(true); }
  else if(mode === 'coach' && ui.tab === 'squad' && !ui.profile && ui.sqv === 'chat'){ if(ui.cdm) loadCoachDms(true); else if(ui.cmine) loadCoachInbox(true); else loadCoachChat(true); }
}
async function chatReport(id){
  if(!arm('rp' + id)) return;
  ui.armed = null;
  try{
    const {data, error} = await sb.rpc(ui.chview === 'dm' ? 'dm_report' : 'chat_report', {p_code: pcode, p_msg: Number(id)});
    if(error || data !== 'ok'){ toast('Could not report. Try again.'); return; }
    ui.reported = ui.reported || {}; ui.reported[id] = true;
    toast('Reported. The coaches will take a look.');
  }catch(e){ toast('Could not connect. Check your internet.'); }
}
async function potmVote(cid){
  const r = pr.potm && pr.potm.round; if(!r || ui.vbusy) return;
  ui.vbusy = true;
  try{
    const {data, error} = await sb.rpc('potm_vote', {p_code: pcode, p_round: r.id, p_candidate: cid});
    ui.vbusy = false;
    if(error){ toast('Could not save your vote. Check your internet.'); return; }
    toast({ok: 'Your vote is saved', self: 'You cannot vote for yourself', closed: 'Voting has closed'}[data] || 'That vote did not work');
    await loadPotm();
  }catch(e){ ui.vbusy = false; toast('Could not connect. Check your internet.'); }
}

function startTicker(){ if(!tickStarted){ tickStarted = true; setInterval(tick, 250); setInterval(pollCloud, 8000); setInterval(() => { if(mode === 'coach' && ui.tab === 'tour' && ui.tid) loadReplies(); }, 10000); } }

setInterval(chatPoll, 7000);
setInterval(() => {
  if(document.visibilityState !== 'visible' || mode !== 'player' || ui.ptab !== 'chat' || ui.chBusy) return;
  if(ui.chview === 'dm' && ui.dmCoach) loadCdm(true); else if(ui.chview === 'dm' && ui.dmWith) loadDm(true); else if(!ui.chview || ui.chview === 'chat') loadChat(true);
}, 3500);
setInterval(presenceTick, 20000);
document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'visible') presenceTick(); });
(async function init(){
  if(!sb){ mode = 'login'; render(); return; }
  try{
    const { data } = await sb.auth.getSession();
    if(data && data.session && data.session.user){ user = data.session.user; await enterCoach(); return; }
  }catch(e){}
  let saved = null; try{ saved = localStorage.getItem(PCODE_KEY); }catch(e){}
  if(saved){ await enterPlayer(saved, false); return; }
  mode = 'login'; render();
})();
</script>
</body>
