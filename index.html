<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Elixir FC</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --deep:#241848;
  --violet:#43307F;
  --amber:#F2B04A;
  --bg:#F5F3FB;
  --card:#FFFFFF;
  --line:#DDD7EE;
  --text:#1F1838;
  --muted:#6B6585;
  --here:#1F8A70;
  --late:#C98A1B;
  --out:#C0443C;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font-family:"Gill Sans","Gill Sans MT",Calibri,"Trebuchet MS",system-ui,sans-serif;font-size:16px;line-height:1.35;-webkit-text-size-adjust:100%}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 100px}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
header{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:14px}
h1{margin:0;font-size:24px;font-weight:800;letter-spacing:.2px;color:var(--deep)}
.sub{color:var(--muted);font-size:14px}
h2{margin:0 0 8px;font-size:17px;font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.muted{color:var(--muted)}
.small{font-size:13px}
.banner{background:#FFF3D6;border:1px solid #EBCB85;border-radius:10px;padding:8px 12px;margin-bottom:12px;font-size:14px}

/* buttons */
.btn{border:1px solid var(--line);background:#fff;border-radius:10px;min-height:44px;padding:0 14px;font-weight:600}
.btn.primary{background:var(--violet);border-color:var(--violet);color:#fff}
.btn.danger{color:var(--out);border-color:#E8C2BF}
.btn.armed{background:var(--out);border-color:var(--out);color:#fff}
.btn.small{min-height:36px;padding:0 10px;font-size:14px}
.row{display:flex;gap:8px;align-items:center}
.row.wrap-r{flex-wrap:wrap}
.grow{flex:1}

/* inputs */
input[type=text],input[type=date],input[type=number],input[type=email],input[type=password],textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;min-height:44px}
textarea{min-height:84px;resize:vertical}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}

/* timer */
.timer{background:var(--deep);color:#fff;border-radius:18px;padding:18px 16px 16px;margin-bottom:12px}
.timer .blockname{font-size:17px;font-weight:700;opacity:.95}
.timer .clock{font-size:68px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.05;margin:2px 0 4px;letter-spacing:-1px}
.timer .left{font-size:14px;opacity:.75;margin-bottom:12px}
.segs{display:flex;gap:3px;height:10px;margin-bottom:14px}
.seg{background:rgba(255,255,255,.18);border-radius:3px;overflow:hidden;position:relative}
.seg i{position:absolute;inset:0 auto 0 0;width:0;background:var(--amber)}
.tctl{display:grid;grid-template-columns:1fr auto auto auto;gap:8px}
.tbtn{min-height:48px;border-radius:12px;border:1px solid rgba(255,255,255,.3);background:transparent;color:#fff;font-weight:700;padding:0 14px}
.tbtn.go{background:var(--amber);border-color:var(--amber);color:var(--deep);font-size:18px}
.tbtn:disabled{opacity:.4}
.timer.done .clock{color:var(--amber)}

/* blocks */
.blk{display:grid;grid-template-columns:22px 1fr 64px 36px;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.blk:first-child{border-top:0}
.blk .mark{width:10px;height:10px;border-radius:50%;background:var(--line);justify-self:center}
.blk.now .mark{background:var(--amber);box-shadow:0 0 0 3px #F2B04A44}
.blk.past .mark{background:var(--violet)}
.blk input{min-height:38px;padding:6px 8px}
.blk .x{border:0;background:transparent;color:var(--muted);font-size:20px;min-height:36px}

/* attendance */
.counts{display:flex;gap:14px;flex-wrap:wrap;margin:2px 0 10px;font-size:14px}
.counts b{font-size:18px}
.c-here b{color:var(--here)} .c-late b{color:var(--late)} .c-out b{color:var(--out)} .c-none b{color:var(--muted)}
.att{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.att:first-of-type{border-top:0}
.att .who{flex:1;min-width:0}
.att .who b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg3{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg3 button{border:0;background:#fff;min-height:44px;min-width:58px;padding:0 6px;font-size:13px;font-weight:600;border-left:1px solid var(--line)}
.seg3 button:first-child{border-left:0}
.seg3 button.on.P{background:var(--here);color:#fff}
.seg3 button.on.L{background:var(--late);color:#fff}
.seg3 button.on.A{background:var(--out);color:#fff}
.grp{font-size:13px;color:var(--muted);margin:10px 0 0;padding-top:8px;border-top:1px solid var(--line)}

/* squad + log */
.pl{display:flex;align-items:center;gap:8px;padding:9px 0;border-top:1px solid var(--line)}
.pl:first-child{border-top:0}
.rate{font-variant-numeric:tabular-nums;text-align:right;min-width:92px}
.bar{height:5px;background:var(--line);border-radius:3px;margin-top:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--here)}
.sess-h{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:none;border:0;padding:0;min-height:44px}
.pill{display:inline-block;border-radius:999px;padding:1px 9px;font-size:13px;font-weight:600;margin-right:4px}
.pill.P{background:#DDF1EA;color:var(--here)} .pill.L{background:#FBEBCB;color:#8A5E0A} .pill.A{background:#F6DAD7;color:var(--out)}
.names{margin:6px 0;font-size:14px}
.empty{text-align:center;padding:22px 10px;color:var(--muted)}
.empty b{display:block;color:var(--text);margin-bottom:4px;font-size:17px}

/* profile + ratings */
select{border:1px solid var(--line);border-radius:8px;background:#fff;min-height:36px;padding:0 6px}
.rt{display:flex;gap:6px;align-items:center;font-size:13px;margin:4px 0 0;color:var(--muted)}
.tog{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.tog .btn.on{background:var(--violet);border-color:var(--violet);color:#fff}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.three{display:grid;grid-template-columns:1fr 36px 1fr;gap:8px;align-items:end}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.chip{border-radius:10px;padding:5px 10px;font-weight:700;min-width:44px;text-align:center;background:#EEE;font-size:15px}
.chip small{display:block;font-weight:600;font-size:11px;opacity:.8}
.chip.hi,.chip.P{background:#DDF1EA;color:var(--here)}
.chip.mid,.chip.L{background:#FBEBCB;color:#8A5E0A}
.chip.lo,.chip.A{background:#F6DAD7;color:var(--out)}
.big{font-size:30px;font-weight:800;line-height:1.1}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.plbtn{background:none;border:0;text-align:left;padding:0;min-height:44px;flex:1;min-width:0}
.back{border:0;background:none;color:var(--violet);font-weight:700;min-height:44px;padding:0}
/* home */
.hero{background:var(--deep);color:#fff;border-radius:18px;padding:18px 16px 16px;margin-bottom:12px}
.hero .hello{font-size:32px;font-weight:800;letter-spacing:-.5px;line-height:1.05}
.hero .hdate{opacity:.7;font-size:14px;margin:4px 0 14px}
.hero .hnow{font-size:15px;font-weight:700}
.hero .hclock{font-size:56px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.05;margin:2px 0}
.hero .hleft{font-size:14px;opacity:.75;margin-bottom:12px}
.hero .two{gap:8px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--bg);border-radius:12px;padding:10px 12px}
.tile .big{font-size:28px}
.nudge{background:#FFF3D6;border:1px solid #EBCB85;border-radius:14px;padding:12px 14px;margin-bottom:12px}
.hrow{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;min-height:52px}
.hrow:first-of-type{border-top:0}
/* avatars */
.av{border-radius:50%;object-fit:cover;background:var(--violet);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;flex:none}
.filebtn{position:relative;display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 16px;border:1px solid var(--line);border-radius:10px;background:#fff;font-weight:600;font-size:14px;overflow:hidden}
.filebtn input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:100px}
.filebtn:focus-within{outline:3px solid var(--amber);outline-offset:2px}
/* cloud */
.login{max-width:420px;margin:0 auto;padding-top:4vh}
.login .brand{font-size:36px;font-weight:800;color:var(--deep);letter-spacing:-.5px;line-height:1}
.login .tag{color:var(--muted);margin:6px 0 20px}
.codebox{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:26px;font-weight:700;letter-spacing:2px;background:var(--bg);border:1px dashed var(--violet);border-radius:12px;padding:12px;text-align:center;margin:8px 0 10px;user-select:all}
.badge{text-align:right;margin:-6px 0 8px;font-size:12px;color:var(--muted)}
/* front page picture frame style */
.front-banner{width:100%;border-radius:14px;overflow:hidden;margin-bottom:14px;border:1px solid var(--line);background:#000;}
.front-banner img{width:100%;display:block;max-height:280px;object-fit:cover;}
/* nav */
nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav button{border:0;background:none;min-height:58px;font-weight:700;color:var(--muted);position:relative;font-size:12px;padding:0 2px}
nav button.on{color:var(--violet)}
nav button.on::before{content:"";position:absolute;top:0;left:20%;right:20%;height:3px;background:var(--violet);border-radius:0 0 3px 3px}
.toast{position:fixed;left:50%;bottom:76px;transform:translateX(-50%);background:var(--deep);color:#fff;padding:9px 16px;border-radius:999px;font-size:14px;z-index:5}
@media (prefers-reduced-motion:no-preference){.seg i{transition:width .25s linear}}
@media (max-width:370px){.timer .clock{font-size:58px}.seg3 button{min-width:50px}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
/* ====== SET THESE TWO FROM YOUR SUPABASE PROJECT (Project Settings > API) ====== */
const SUPABASE_URL = 'https://anjgjzyhjxvujcgwhvau.supabase.co';
const SUPABASE_KEY = 'sb_publishable__VKWkTLk68k62QKaXMFzRQ_0jjjO6bm';
/* ================================================================================ */
let KEY = 'elixir-fc-cloud-v1';
const PCODE_KEY = 'elixir-fc-player-code';
const sb = (window.supabase && window.supabase.createClient) ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;
let mode = 'loading', user = null, pdata = null, tickStarted = false;
let clubId = null, cloudExists = false, lastSeen = null;
let knownIds = new Set(), lastPayload = '';
const cloudPayload = () => Object.assign({}, S, {currentId: null, timer: null});
const isHead = () => !!user && clubId === user.id;
const noteKnown = list => (list || []).forEach(s => knownIds.add(s.id));

/* ---------- NEWLY ADDED SAFE HELPERS TO PREVENT CRASHES ---------- */
const leadOf = s => s ? s.lead : null;
const isLead = s => s && user && s.lead === user.id;
const isFinished = s => !!(s && s.finished);
const isCoachStaff = id => !!(user && (clubId === user.id || id === user.id));
const runningSession = () => S.sessions.find(s => S.currentId === s.id) || null;
const formList = pid => {
  const list = [];
  S.sessions.forEach(s => {
    if(s.ratings && s.ratings[pid] != null){
      list.push({r: s.ratings[pid], type: s.type === 'match' ? 'Match' : 'Training', date: s.date});
    }
  });
  return list;
};
const setScore = (s, pid, val) => {
  if(!s.ratings) s.ratings = {};
  if(val == null) delete s.ratings[pid];
  else s.ratings[pid] = val;
};
const subtitle = p => {
  const parts = [];
  if(p.pos) parts.push(p.pos);
  if(p.num) parts.push('#' + p.num);
  if(p.staff) parts.push('Staff');
  return parts.join(' • ');
};
const avatar = (p, size) => {
  const initials = esc((p.name || 'P').split(' ').map(n => n[0]).join('').slice(0,2).toUpperCase());
  if(p.photo) {
    return `<img src="${esc(p.photo)}" class="av" style="width:${size}px;height:${size}px;">`;
  }
  return `<div class="av" style="width:${size}px;height:${size}px;font-size:${Math.round(size/2.5)}px;">${initials}</div>`;
};
const shortDate = str => {
  if(!str) return '';
  const [,m,d] = str.split('-');
  return d && m ? `${d}/${m}` : str;
};
const recalcRating = (s, pid) => {}; // No-op placeholder helper

const DEFAULT_BLOCKS = [
  {name:'Warm-up and possession', min:15},
  {name:'Transition drills', min:15},
  {name:'Build-up vs press', min:15},
  {name:'Small-sided games', min:25},
  {name:'Shooting drills', min:15},
  {name:'Briefing', min:5}
];
const DEFAULT_MATCH_BLOCKS = [{name:'First half', min:30},{name:'Second half', min:30}];
const uid = () => Math.random().toString(36).slice(2, 9);
const clone = o => JSON.parse(JSON.stringify(o));

let S = {
  players: [],
  sessions: [],
  callups: [], 
  currentId: null,
  blocks: clone(DEFAULT_BLOCKS),
  matchBlocks: clone(DEFAULT_MATCH_BLOCKS),
  timer: null
};
let ui = {tab:'home', open:{}, armed:null, toast:'', storageOk:true, newName:'', newStaff:false, draftTitle:'Training', draftDate:todayStr(), draftType:'training', draftOpp:'', profile:null, restoreText:'', email:'', password:'', code:'', sync:'saved', busy:false, callupTitle:'', callupDate:todayStr(), callupOpp:'', selectedCallupSquad:[]};

function todayStr(){
  const d = new Date();
  const p = n => String(n).padStart(2,'0');
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());
}
function fmtDate(str){
  if(!str) return '';
  const [y,m,d] = str.split('-').map(Number);
  return new Date(y, m-1, d).toLocaleDateString('en-GB',{weekday:'short', day:'numeric', month:'short', year:'numeric'});
}
function esc(s){ return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
const cur = () => S.sessions.find(s => s.id === S.currentId) || null;

/* ---------- storage ---------- */
let saveTimer = null;
async function kvSet(str){
  let ok = false;
  try{ if(window.storage){ await window.storage.set(KEY, str, false); ok = true; } }catch(e){}
  try{ localStorage.setItem(KEY, str); ok = true; }catch(e){}
  return ok;
}
async function kvGet(){
  try{ if(window.storage){ const r = await window.storage.get(KEY, false); if(r && r.value) return r.value; } }catch(e){}
  try{ const v = localStorage.getItem(KEY); if(v) return v; }catch(e){}
  return null;
}
function save(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    const ok = await kvSet(JSON.stringify(S));
    if(ok !== ui.storageOk){ ui.storageOk = ok; render(); }
  }, 250);
  cloudSave();
}
let cloudTimer = null;
function syncText(){ return {saved:'Cloud: saved', saving:'Cloud: saving...', error:'Cloud: could not save, will retry', offline:'Offline: showing the copy on this phone'}[ui.sync] || ''; }
function paintSync(){ const el = document.getElementById('syncbadge'); if(el) el.textContent = syncText(); }
const sameTime = (a, b) => !!a && !!b && Date.parse(a) === Date.parse(b);
function normalizeS(){
  if(!S.matchBlocks) S.matchBlocks = clone(DEFAULT_MATCH_BLOCKS);
  if(!S.blocks) S.blocks = clone(DEFAULT_BLOCKS);
  if(!S.callups) S.callups = [];
  if(S.currentId && !cur()){ S.currentId = null; S.timer = null; }
  if(cur() && !S.timer) initTimer();
  catchUp();
}
function mergeClub(L, R){
  const out = clone(L);
  if(isHead()){
    const have = new Set(out.players.map(p => p.id));
    (R.players || []).forEach(rp => { if(!have.has(rp.id)) out.players.push(clone(rp)); });
  }else{
    out.players = clone(R.players || []);
  }
  out.callups = clone(R.callups || out.callups || []);
  const remoteIds = new Set((R.sessions || []).map(s => s.id));
  out.sessions = out.sessions.filter(s => remoteIds.has(s.id) || !knownIds.has(s.id));
  const me = user && user.id;
  (R.sessions || []).forEach(rs => {
    let s = out.sessions.find(x => x.id === rs.id);
    if(!s){ out.sessions.push(clone(rs)); return; }
    const localNewer = (s.leadChangedAt || 0) > (rs.leadChangedAt || 0);
    const iLead = (localNewer ? leadOf(s) : leadOf(rs)) === me;
    const lsc = s.scores || {}, rsc = rs.scores || {};
    if(!iLead){
      const idx = out.sessions.indexOf(s); s = clone(rs); out.sessions[idx] = s;
    }else{
      s.marks = Object.assign({}, rs.marks || {}, s.marks || {});
      s.ratings = Object.assign({}, rs.ratings || {}, s.ratings || {});
      s.names = Object.assign({}, rs.names || {}, s.names || {});
      if(!s.notes && rs.notes) s.notes = rs.notes;
    }
    const merged = {};
    new Set(Object.keys(lsc).concat(Object.keys(rsc))).forEach(pid => {
      const mine = lsc[pid] && Object.prototype.hasOwnProperty.call(lsc[pid], me) ? {[me]: lsc[pid][me]} : {};
      merged[pid] = Object.assign({}, rsc[pid] || {}, mine);
    });
    if(Object.keys(merged).length){ s.scores = merged; Object.keys(merged).forEach(pid => recalcRating(s, pid)); }
  });
  return out;
}
function cloudSave(){
  if(mode !== 'coach' || !user || !sb) return;
  ui.sync = 'saving'; paintSync();
  clearTimeout(cloudTimer);
  cloudTimer = setTimeout(doCloudSave, 1000);
}
async function doCloudSave(){
  cloudTimer = null;
  let merged = false;
  try{
    if(cloudExists){
      const r0 = await sb.from('club_data').select('data,updated_at').eq('owner_id', clubId).maybeSingle();
      if(r0.error) throw r0.error;
      const row = r0.data;
      if(row && row.data && row.data.players){
        if(!sameTime(row.updated_at, lastSeen)){
          S = mergeClub(S, row.data); merged = true;
          kvSet(JSON.stringify(S));
        }else if(!isHead()){
          S.players = clone(row.data.players);
          S.callups = clone(row.data.callups || []);
        }
        noteKnown(row.data.sessions);
      }
    }
    const plJson = JSON.stringify(cloudPayload());
    if(cloudExists && !merged && plJson === lastPayload){ ui.sync = 'saved'; paintSync(); return; }
    const ts = new Date().toISOString();
    let err = null;
    if(cloudExists){
      const r = await sb.from('club_data').update({data: cloudPayload(), updated_at: ts}).eq('owner_id', clubId).select('owner_id');
      err = r.error || ((r.data && r.data.length) ? null : new Error('no access'));
    }else{
      const r = await sb.from('club_data').insert({owner_id: clubId, data: cloudPayload(), updated_at: ts});
      err = r.error; if(!err) cloudExists = true;
    }
    if(err) throw err;
    lastSeen = ts; lastPayload = plJson; ui.sync = 'saved'; noteKnown(S.sessions);
    if(merged) render();
  }catch(e){
    ui.sync = 'error';
    if(!cloudTimer) cloudTimer = setTimeout(doCloudSave, 8000);
  }
  paintSync();
}
async function pollCloud(){
  if(mode !== 'coach' || !user || !sb || !cloudExists || cloudTimer || ui.sync === 'saving' || ui.sync === 'error') return;
  const a = document.activeElement;
  if(a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) return;
  try{
    const { data, error } = await sb.from('club_data').select('data,updated_at').eq('owner_id', clubId).maybeSingle();
    if(error || !data || !data.data || !data.data.players) return;
    if(!sameTime(data.updated_at, lastSeen) && !cloudTimer){
      const keepOpen = S.currentId, keepTimer = S.timer;
      S = data.data; S.currentId = keepOpen; S.timer = keepTimer;
      lastSeen = data.updated_at; noteKnown(S.sessions);
      normalizeS(); lastPayload = JSON.stringify(cloudPayload()); kvSet(JSON.stringify(S)); render();
    }
  }catch(e){}
}
async function load(){
  try{
    const v = await kvGet();
    if(v){
      const d = JSON.parse(v);
      if(d && d.players && d.sessions){ S = d; if(!S.matchBlocks) S.matchBlocks = clone(DEFAULT_MATCH_BLOCKS); if(!S.callups) S.callups = []; }
    }
  }catch(e){}
}

/* ---------- timer ---------- */
const blocksOf = () => { const s = cur(); return s ? s.blocks : []; };
function initTimer(){
  const b = blocksOf();
  S.timer = {idx:0, remaining:(b[0] ? b[0].min : 0)*60000, running:false, endAt:0, done:false};
}
function catchUp(){
  const t = S.timer; if(!t || !t.running) return;
  const b = blocksOf();
  while(t.running && t.endAt <= Date.now()){
    if(t.idx < b.length-1){
      t.idx++;
      t.endAt += b[t.idx].min*60000;
    }else{
      t.running = false; t.done = true; t.remaining = 0;
    }
  }
  if(t.running) t.remaining = t.endAt - Date.now();
}
let audioCtx = null, wakeLock = null;
function prepAudio(){
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if(audioCtx.state === 'suspended') audioCtx.resume();
  }catch(e){}
}
function beep(times){
  try{
    if(navigator.vibrate) navigator.vibrate([250,120,250]);
    if(!audioCtx) return;
    for(let i=0;i<times;i++){
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.frequency.value = 880; o.connect(g); g.connect(audioCtx.destination);
      const t0 = audioCtx.currentTime + i*0.35;
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(0.4, t0+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0+0.25);
      o.start(t0); o.stop(t0+0.28);
    }
  }catch(e){}
}
async function holdScreen(on){
  try{
    if(on && navigator.wakeLock && !wakeLock){ wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => { wakeLock = null; }); }
    if(!on && wakeLock){ await wakeLock.release(); wakeLock = null; }
  }catch(e){}
}
function tStart(){
  const t = S.timer; if(!t || t.done) return;
  prepAudio();
  t.running = true; t.endAt = Date.now() + t.remaining;
  holdScreen(true); save(); render();
}
function tPause(){
  const t = S.timer; if(!t) return;
  t.remaining = Math.max(0, t.endAt - Date.now());
  t.running = false; holdScreen(false); save(); render();
}
function tGo(i){
  const t = S.timer, b = blocksOf();
  if(!t || i < 0 || i >= b.length) return;
  const was = t.running;
  t.idx = i; t.done = false; t.remaining = b[i].min*60000;
  t.endAt = Date.now() + t.remaining; t.running = was;
  save(); render();
}
function tReset(){
  const t = S.timer, b = blocksOf(); if(!t) return;
  t.done = false; t.remaining = b[t.idx].min*60000; t.endAt = Date.now() + t.remaining;
  save(); render();
}
function tick(){
  const t = S.timer; if(!t || !t.running) return;
  const idxBefore = t.idx;
  const b = blocksOf();
  if(t.endAt <= Date.now()){
    catchUp();
    if(t.done){ beep(3); holdScreen(false); toast('Session finished'); }
    else if(t.idx !== idxBefore){ beep(2); toast('Next: ' + b[t.idx].name); }
    save(); render(); return;
  }
  t.remaining = t.endAt - Date.now();
  paintTimer();
}
function mmss(ms){
  const s = Math.max(0, Math.ceil(ms/1000));
  return String(Math.floor(s/60)).padStart(2,'0') + ':' + String(s%60).padStart(2,'0');
}
function paintTimer(){
  const t = S.timer, b = blocksOf(); if(!t || !b.length) return;
  const clock = document.getElementById('clock');
  if(clock) clock.textContent = mmss(t.remaining);
  const left = document.getElementById('left');
  if(left){
    let rest = t.remaining;
    for(let i=t.idx+1;i<b.length;i++) rest += b[i].min*60000;
    left.textContent = t.done ? 'All blocks complete' : mmss(rest) + ' left in the session';
  }
  document.querySelectorAll('.seg i').forEach((el, i) => {
    const total = b[i].min*60000;
    let p = 0;
    if(i < t.idx || t.done) p = 100;
    else if(i === t.idx) p = Math.max(0, Math.min(100, (1 - t.remaining/total)*100));
    el.style.width = p + '%';
  });
}

/* ---------- attendance helpers ---------- */
function counts(s, staff){
  const roster = S.players.filter(p => p.staff === staff);
  const c = {P:0, L:0, A:0, none:0};
  roster.forEach(p => { const m = s.marks[p.id]; if(m) c[m]++; else c.none++; });
  return c;
}
function nameOf(s, id){
  const p = S.players.find(x => x.id === id);
  return p ? p.name : (s.names && s.names[id]) || 'Unknown';
}
function listBy(s, val, staff){
  return Object.keys(s.marks).filter(id => s.marks[id] === val && isStaff(id, s) === staff).map(id => nameOf(s, id));
}
function isStaff(id, s){
  const p = S.players.find(x => x.id === id);
  if(p) return p.staff;
  return !!(s.staffIds && s.staffIds.includes(id));
}
function sessLabel(s){ return s.type === 'match' ? 'Match vs ' + (s.opp || 'opponent') : (s.title || 'Training'); }
function scoreText(s){ return (s.type === 'match' && s.gf !== '' && s.ga !== '' && s.gf != null && s.ga != null) ? s.gf + '-' + s.ga : ''; }
function summaryText(s){
  const head = s.type === 'match'
    ? 'Elixir FC match: ' + (scoreText(s) ? 'Elixir FC ' + scoreText(s) + ' ' + (s.opp || 'opponent') : 'vs ' + (s.opp || 'opponent')) + ', ' + fmtDate(s.date)
    : 'Elixir FC training: ' + fmtDate(s.date) + (s.title ? ' (' + s.title + ')' : '');
  const lines = [head];
  const pl = v => listBy(s, v, false);
  const P = pl('P'), L = pl('L'), A = pl('A');
  lines.push('Present (' + P.length + '): ' + (P.join(', ') || 'none'));
  lines.push('Late (' + L.length + '): ' + (L.join(', ') || 'none'));
  lines.push('Absent (' + A.length + '): ' + (A.join(', ') || 'none'));
  const sp = listBy(s,'P',true).concat(listBy(s,'L',true));
  if(sp.length) lines.push('Staff: ' + sp.join(', '));
  if(s.notes && s.notes.trim()) lines.push('Notes: ' + s.notes.trim());
  return lines.join('\n');
}
function playerRate(p){
  let total = 0, att = 0;
  S.sessions.forEach(s => { if(s.type === 'match') return; const m = s.marks[p.id]; if(m){ total++; if(m === 'P') att += 1; else if(m === 'L') att += 0.5; } });
  return {total, att, pct: total ? Math.round(att/total*100) : null};
}
function playerFormScore(pid){
  const fl = formList(pid).slice(0,5);
  if(!fl.length) return '-';
  return (fl.reduce((a,x) => a + x.r, 0)/fl.length).toFixed(1);
}

/* ---------- actions ---------- */
function toast(msg){
  ui.toast = msg; render();
  clearTimeout(toast._t);
  toast._t = setTimeout(() => { ui.toast = ''; render(); }, Math.max(2200, msg.length * 70));
}
function arm(key){
  if(ui.armed === key) return true;
  ui.armed = key; render();
  clearTimeout(arm._t);
  arm._t = setTimeout(() => { ui.armed = null; render(); }, 3000);
  return false;
}
async function copyText(text){
  try{ await navigator.clipboard.writeText(text); toast('Copied'); return; }catch(e){}
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  let ok = false;
  try{ ok = document.execCommand('copy'); }catch(e){}
  document.body.removeChild(ta);
  if(ok) toast('Copied');
  else { ui.fallbackText = text; render(); }
}
function startSession(){
  const r = runningSession();
  if(r){ toast('A session is already running. Join it from Home.'); ui.tab = 'train'; render(); return; }
  const type = ui.draftType === 'match' ? 'match' : 'training';
  const s = {id:uid(), type, date:ui.draftDate || todayStr(),
    title: type === 'match' ? 'Match' : (ui.draftTitle || 'Training').trim(),
    opp: type === 'match' ? (ui.draftOpp || '').trim() : '', gf:'', ga:'',
    notes:'', marks:{}, ratings:{}, scores:{}, names:{}, staffIds:[],
    lead: user.id, finished: false,
    blocks: clone(type === 'match' ? S.matchBlocks : S.blocks)};
  S.sessions.push(s); S.currentId = s.id; initTimer(); save(); render();
}
function finishSession(){
  const s = cur();
  if(!s || !isLead(s) || isFinished(s)){ toast('Only the coach who started this session can finish it'); return; }
  s.finished = true; s.finishedAt = new Date().toISOString();
  if(S.timer && S.timer.running){ S.timer.running = false; holdScreen(false); }
  save(); render(); window.scrollTo(0,0);
  toast('Session finished. Now give your scores.');
}
function leaveSession(){
  if(S.timer && S.timer.running) holdScreen(false);
  S.currentId = null; S.timer = null; ui.draftTitle = 'Training'; ui.draftDate = todayStr(); ui.draftType = 'training'; ui.draftOpp = '';
  save(); render();
}
function openSession(id){
  const ss = S.sessions.find(x => x.id === id); if(!ss) return;
  S.currentId = id;
  S.timer = isFinished(ss) ? {idx: Math.max(0, ss.blocks.length - 1), remaining: 0, running: false, endAt: 0, done: true} : null;
  if(!S.timer) initTimer();
  ui.tab = 'train'; save(); render(); window.scrollTo(0,0);
}
function mark(pid, val){
  const s = cur(); if(!s || !user) return;
  if(!isLead(s) || isFinished(s)){ toast('Only the coach who started this session can take attendance'); return; }
  const p = S.players.find(x => x.id === pid); if(!p) return;
  if(s.marks[pid] === val) delete s.marks[pid]; else s.marks[pid] = val;
  s.names[pid] = p.name;
  if(p.staff && !s.staffIds.includes(pid)) s.staffIds.push(pid);
  save(); render();
}
function allPresent(){
  const s = cur(); if(!s || !user || !isLead(s) || isFinished(s)) return;
  S.players.filter(p => !p.staff).forEach(p => { if(!s.marks[p.id]){ s.marks[p.id] = 'P'; s.names[p.id] = p.name; } });
  save(); render();
}
function syncBlocks(){ const s = cur(); if(s){ if(s.type === 'match') S.matchBlocks = clone(s.blocks); else S.blocks = clone(s.blocks); } save(); }

const LEAD_ACTS = new Set(['mark','allpresent','blkadd','blkdel']);
const ADMIN_ACTS = new Set(['takeover','addplayer','delplayer','gencode','newcode','copycode','invite','backup','restore','resetall','delsession','rmphoto','createcallup','delcallup','finalizecallup']);
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if(!el) return;
  const a = el.dataset.act, id = el.dataset.id, v = el.dataset.v;
  if(ADMIN_ACTS.has(a) && !isHead() && !isCoachStaff(user?.id)){ 
    // allow assistant coaches or head coaches for certain staff management tasks, but block if needed
  }
  switch(a){
    case 'tab': ui.tab = v; ui.profile = null; ui.armed = null; render(); window.scrollTo(0,0); break;
    case 'start': startSession(); break;
    case 'draftType': ui.draftType = v; render(); break;
    case 'profile': ui.tab = 'squad'; ui.profile = id; render(); window.scrollTo(0,0); break;
    case 'rmphoto': { const pl = S.players.find(x => x.id === id); if(pl){ delete pl.photo; save(); render(); } break; }
    case 'backprofile': ui.profile = null; render(); break;
    case 'end': finishSession(); break;
    case 'mark': mark(id, v); break;
    case 'allpresent': allPresent(); break;
    case 'tgo': S.timer && S.timer.running ? tPause() : tStart(); break;
    case 'tnext': tGo(S.timer.idx + 1); break;
    case 'tprev': tGo(S.timer.idx - 1); break;
    case 'treset': tReset(); break;
    case 'jump': tGo(Number(v)); break;
    case 'blkadd': { const s = cur(); s.blocks.push({name:'New block', min:10}); syncBlocks(); render(); break; }
    case 'blkdel': {
      const s = cur(); if(s.blocks.length <= 1) break;
      const i = Number(v); s.blocks.splice(i,1);
      if(S.timer.idx >= s.blocks.length) S.timer.idx = s.blocks.length-1;
      if(!S.timer.running) S.timer.remaining = s.blocks[S.timer.idx].min*60000;
      syncBlocks(); render(); break;
    }
    case 'addplayer': {
      const name = (ui.newName || '').trim(); if(!name) { toast('Type a name first'); break; }
      S.players.push({id:uid(), name, pos:(ui.newPos || '').trim(), staff:ui.newStaff});
      ui.newName = ''; ui.newPos = ''; ui.newStaff = false; save(); render(); toast('Player added successfully'); break;
    }
    case 'delplayer':
      if(arm('dp'+id)){ S.players = S.players.filter(p => p.id !== id); if(ui.profile === id) ui.profile = null; ui.armed = null; save(); render(); }
      break;
    case 'togglelog': ui.open[id] = !ui.open[id]; render(); break;
    case 'copy': { const s = S.sessions.find(x => x.id === id); if(s) copyText(summaryText(s)); break; }
    case 'copycur': { const s = cur(); if(s) copyText(summaryText(s)); break; }
    case 'delsession':
      if(arm('ds'+id)){
        S.sessions = S.sessions.filter(s => s.id !== id);
        if(S.currentId === id){ S.currentId = null; S.timer = null; }
        ui.armed = null; save(); render();
      }
      break;
    case 'coachSignIn': coachSignIn(); break;
    case 'playerEnter': playerEnter(); break;
    case 'signout': signOut(); break;
    case 'plogout': playerLogout(); break;
    case 'refreshPlayer': enterPlayer(localStorage.getItem(PCODE_KEY), false); break;
    case 'gencode': { const pl = S.players.find(x => x.id === id); if(pl){ pl.code = newCode(); save(); render(); } break; }
    case 'newcode': if(arm('nc'+id)){ const pl = S.players.find(x => x.id === id); if(pl){ pl.code = newCode(); ui.armed = null; save(); render(); toast('New code created.'); } } break;
    case 'copycode': { const pl = S.players.find(x => x.id === id); if(pl && pl.code) copyText(pl.code); break; }
    case 'invite': { const pl = S.players.find(x => x.id === id); if(pl && pl.code) copyText('Hi ' + pl.name + ', this is your Elixir FC page: ' + location.origin + location.pathname + '\nYour code: ' + fmtCode(pl.code)); break; }
    case 'backup': S.lastBackup = Date.now(); save(); copyText(JSON.stringify(S)); break;
    case 'open': openSession(id); break;
    case 'gotrain': ui.tab = 'train'; render(); window.scrollTo(0,0); break;
    case 'leave': leaveSession(); break;
    case 'editatt': {
      const ss = S.sessions.find(x => x.id === id);
      if(!ss || !isLead(ss)){ toast('Only the coach who started this session can edit attendance'); break; }
      ss.finished = false; delete ss.finishedAt; openSession(id); break;
    }
    case 'takeover': {
      if(!arm('tk'+id)) break;
      const ss = S.sessions.find(x => x.id === id); if(!ss) break;
      ss.lead = user.id; ss.leadChangedAt = Date.now(); ui.armed = null; save(); render();
      toast('You are now the lead of this session'); break;
    }
    case 'quick': ui.draftType = v; ui.tab = 'train'; render(); window.scrollTo(0,0); break;
    case 'openlog': ui.open[id] = true; ui.tab = 'log'; render(); window.scrollTo(0,0); break;
    case 'resetall':
      if(arm('reset')){
        if(S.timer && S.timer.running) holdScreen(false);
        S = {players:[], sessions:[], callups:[], currentId:null, blocks:clone(DEFAULT_BLOCKS), matchBlocks:clone(DEFAULT_MATCH_BLOCKS), timer:null};
        ui.profile = null; ui.armed = null; ui.open = {}; ui.restoreText = ''; ui.tab = 'home';
        save(); render(); toast('Everything deleted');
      }
      break;
    case 'restore': {
      try{
        const d = JSON.parse((ui.restoreText || '').trim());
        if(!d || !Array.isArray(d.players) || !Array.isArray(d.sessions)) throw new Error('bad');
        if(!arm('restore')) break;
        S = d; if(!S.callups) S.callups = []; if(S.currentId && !cur()){ S.currentId = null; S.timer = null; }
        if(cur() && !S.timer) initTimer();
        ui.restoreText = ''; ui.armed = null; save(); render(); toast('Backup restored');
      }catch(err){ toast('That is not a valid backup'); }
      break;
    }
    case 'closefallback': ui.fallbackText = null; render(); break;
    case 'togcallup': {
      const idx = ui.selectedCallupSquad.indexOf(id);
      if(idx >= 0) ui.selectedCallupSquad.splice(idx, 1);
      else ui.selectedCallupSquad.push(id);
      render();
      break;
    }
    case 'createcallup': {
      const title = (ui.callupTitle || '').trim();
      if(!title){ toast('Enter tournament title'); break; }
      if(!ui.selectedCallupSquad.length){ toast('Select at least one player for the call up'); break; }
      S.callups.push({
        id: uid(),
        title,
        date: ui.callupDate || todayStr(),
        opp: (ui.callupOpp || '').trim(),
        squads: [...ui.selectedCallupSquad],
        finalized: false,
        accepted: [],
        rejected: []
      });
      ui.callupTitle = ''; ui.callupOpp = ''; ui.selectedCallupSquad = [];
      save(); render(); toast('Tournament call up created');
      break;
    }
    case 'delcallup': {
      if(arm('dc'+id)){
        S.callups = S.callups.filter(c => c.id !== id);
        ui.armed = null; save(); render(); toast('Call up deleted');
      }
      break;
    }
    case 'finalizecallup': {
      const c = S.callups.find(x => x.id === id);
      if(c){
        c.finalized = true;
        save(); render(); toast('Call up finalized and announced on home page!');
      }
      break;
    }
    case 'respondcallup': {
      const callupId = el.dataset.callup;
      const resp = el.dataset.resp; // 'accept' or 'reject'
      const c = S.callups.find(x => x.id === callupId);
      if(c && pdata){
        c.accepted = (c.accepted || []).filter(pid => pid !== pdata.id);
        c.rejected = (c.rejected || []).filter(pid => pid !== pdata.id);
        if(resp === 'accept') c.accepted.push(pdata.id);
        if(resp === 'reject') c.rejected.push(pdata.id);
        save();
        doCloudSave();
        render();
        toast(resp === 'accept' ? 'Response saved: Accepted!' : 'Response saved: Rejected.');
      }
      break;
    }
  }
});

document.addEventListener('change', e => {
  const k = e.target.dataset.in; if(!k) return;
  const i = Number(e.target.dataset.i);
  if(k === 'blkName'){ cur().blocks[i].name = e.target.value || 'Block'; syncBlocks(); render(); }
  else if(k === 'blkMin'){
    const m = Math.max(1, Math.min(180, Math.round(Number(e.target.value) || 1)));
    const s = cur(); s.blocks[i].min = m;
    if(S.timer && i === S.timer.idx && !S.timer.running){ S.timer.remaining = m*60000; S.timer.done = false; }
    syncBlocks(); render();
  }
  else if(k === 'photo'){ setPhoto(e.target.dataset.id, e.target.files && e.target.files[0]); e.target.value = ''; }
  else if(k === 'newStaff') { ui.newStaff = e.target.checked; }
  else if(k === 'rating'){
    const s = cur(); if(!s || !user) return;
    if(!isFinished(s)){ toast('You can give scores when the session is finished'); render(); return; }
    setScore(s, e.target.dataset.id, e.target.value === '' ? null : Number(e.target.value));
    save(); render();
  }
  else if(k === 'sessDate') { cur().date = e.target.value || cur().date; save(); render(); }
  else if(k === 'pf'){
    const pl = S.players.find(x => x.id === e.target.dataset.id);
    if(pl){
      const f = e.target.dataset.f;
      if(isHead() || ['name','age','num','foot'].includes(f)){
        pl[f] = e.target.value; save();
      }
    }
  }
});

/* ---------- player login / auth flow implementation helpers ---------- */
function newCode(){
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let res = '';
  for(let i=0; i<6; i++) res += chars[Math.floor(Math.random()*chars.length)];
  return res;
}
function fmtCode(c){
  if(!c) return '';
  const clean = String(c).replace(/[^a-zA-Z0-9]/g, '').toUpperCase();
  if(clean.length <= 3) return clean;
  return clean.slice(0,3) + '-' + clean.slice(3,6);
}

async function initApp(){
  await load();
  if(!sb){
    mode = 'coach';
    clubId = 'local-club';
    user = {id: clubId, email: 'local@elixir.fc'};
    normalizeS();
    render();
    setInterval(tick, 250);
    return;
  }
  try{
    const { data: { session } } = await sb.auth.getSession();
    if(session && session.user){
      user = session.user;
      clubId = user.id;
      await fetchCloudData();
      mode = 'coach';
      normalizeS();
      render();
      setInterval(tick, 250);
      setInterval(pollCloud, 10000);
      return;
    }
  }catch(e){}

  const savedPlayerCode = localStorage.getItem(PCODE_KEY);
  if(savedPlayerCode){
    const success = await enterPlayer(savedPlayerCode, false);
    if(success) return;
  }
  mode = 'login';
  render();
}

async function fetchCloudData(){
  if(!sb || !clubId) return;
  try{
    const { data, error } = await sb.from('club_data').select('data,updated_at').eq('owner_id', clubId).maybeSingle();
    if(!error && data && data.data && data.data.players){
      cloudExists = true;
      lastSeen = data.updated_at;
      S = mergeClub(S, data.data);
      noteKnown(data.data.sessions);
      kvSet(JSON.stringify(S));
    }
  }catch(e){}
}

async function coachSignIn(){
  const email = (ui.email || '').trim();
  const password = (ui.password || '').trim();
  if(!email || !password){ toast('Enter email and password'); return; }
  toast('Signing in...');
  try{
    const { data, error } = await sb.auth.signInWithPassword({ email, password });
    if(error) throw error;
    if(data && data.user){
      user = data.user;
      clubId = user.id;
      await fetchCloudData();
      mode = 'coach';
      normalizeS();
      save();
      render();
      setInterval(tick, 250);
      setInterval(pollCloud, 10000);
      toast('Signed in successfully');
    }
  }catch(e){
    toast('Sign in failed: ' + (e.message || 'Check details'));
  }
}

async function playerEnter(){
  const rawCode = (ui.code || '').trim();
  if(!rawCode){ toast('Enter your player code'); return; }
  await enterPlayer(rawCode, true);
}

async function enterPlayer(codeStr, showToastOnFail){
  const clean = String(codeStr).replace(/[^a-zA-Z0-9]/g, '').toUpperCase();
  if(!clean) return false;
  
  if(sb){
    try{
      const { data } = await sb.from('club_data').select('data,updated_at').limit(1).maybeSingle();
      if(data && data.data && data.data.players){
        S = mergeClub(S, data.data);
        kvSet(JSON.stringify(S));
      }
    }catch(e){}
  }

  const foundPlayer = (S.players || []).find(p => p.code && String(p.code).replace(/[^a-zA-Z0-9]/g, '').toUpperCase() === clean);
  if(foundPlayer){
    pdata = foundPlayer;
    localStorage.setItem(PCODE_KEY, clean);
    mode = 'player';
    render();
    if(showToastOnFail) toast('Welcome, ' + foundPlayer.name + '!');
    return true;
  }
  if(showToastOnFail) toast('Invalid player code. Ask your coach for your code.');
  return false;
}

async function signOut(){
  if(sb) { try{ await sb.auth.signOut(); }catch(e){} }
  user = null; clubId = null; cloudExists = false; mode = 'login';
  render();
}

function playerLogout(){
  localStorage.removeItem(PCODE_KEY);
  pdata = null;
  mode = 'login';
  render();
}

function loginHTML(){
  return `<div class="login">
    <div class="brand">Elixir FC</div>
    <div class="tag">Team Management & Attendance</div>
    
    <div class="card">
      <h2>Player Login</h2>
      <label for="pcode">Enter your 6-character player code</label>
      <input type="text" id="pcode" data-in="code" placeholder="e.g. ABC-123 or ABC123" value="${esc(ui.code)}" autocomplete="off" style="text-transform:uppercase;font-family:monospace;font-size:20px;letter-spacing:1px;text-align:center">
      <div style="height:10px"></div>
      <button class="btn primary" style="width:100%" data-act="playerEnter">Enter Player Portal</button>
    </div>

    <div class="card" style="margin-top:20px">
      <h2>Coach Sign In</h2>
      <label for="cemail">Email</label>
      <input type="email" id="cemail" data-in="email" placeholder="Coach email" value="${esc(ui.email)}">
      <div style="height:10px"></div>
      <label for="cpass">Password</label>
      <input type="password" id="cpass" data-in="password" placeholder="Password" value="${esc(ui.password)}">
      <div style="height:12px"></div>
      <button class="btn" style="width:100%" data-act="coachSignIn">Coach Sign In</button>
    </div>
  </div>`;
}

function playerHTML(){
  if(!pdata) return loginHTML();
  pdata = S.players.find(x => x.id === pdata.id) || pdata;
  const rate = playerRate(pdata);
  const fl = formList(pdata.id);
  const avg = fl.length ? (fl.reduce((a,x) => a + x.r, 0)/fl.length).toFixed(1) : '-';
  const matches = S.sessions.filter(s => s.type === 'match' && (s.marks[pdata.id]==='P' || s.marks[pdata.id]==='L')).length;
  const cls = r => r >= 8 ? 'hi' : r >= 5 ? 'mid' : 'lo';

  const playerCallups = (S.callups || []).filter(c => c.finalized && c.squads && c.squads.includes(pdata.id));

  return `
  <header>
    <h1>Elixir FC</h1>
    <button class="btn small" data-act="plogout">Log out</button>
  </header>
  <div class="card">
    <div class="row" style="gap:14px;margin-bottom:12px">
      ${avatar(pdata, 64)}
      <div>
        <div style="font-size:20px;font-weight:800">${esc(pdata.name)}</div>
        <div class="small muted">${esc(subtitle(pdata) || 'Player')}</div>
      </div>
    </div>
    <button class="btn small" data-act="refreshPlayer" style="width:100%">Refresh my stats</button>
  </div>

  ${playerCallups.map(c => {
    const isAccepted = (c.accepted || []).includes(pdata.id);
    const isRejected = (c.rejected || []).includes(pdata.id);
    return `<div class="card" style="background:#FFFBF0;border-color:#F2B04A">
      <h2>🏆 Tournament Call Up: ${esc(c.title)}</h2>
      <div class="small muted" style="margin-bottom:8px">Date: ${fmtDate(c.date)}${c.opp ? '| vs ' + esc(c.opp) : ''}</div>
      <div style="margin-bottom:10px">Congratulations! You have been selected for this tournament squad. Please confirm your availability:</div>
      <div class="row wrap-r">
        <button class="btn small ${isAccepted ? 'primary' : ''}" data-act="respondcallup" data-callup="${c.id}" data-resp="accept">${isAccepted ? '✓ ' : ''}Accept Call Up</button>
        <button class="btn small ${isRejected ? 'danger' : ''}" data-act="respondcallup" data-callup="${c.id}" data-resp="reject">${isRejected ? '✓ ' : ''}Decline / Unavailable</button>
      </div>
    </div>`;
  }).join('')}

  <div class="card">
    <h2>My Performance & Stats</h2>
    <div class="stats" style="margin-bottom:10px">
      <div><div class="big">${avg}</div><div class="small muted">Avg Rating</div></div>
      <div><div class="big">${rate.pct != null ? rate.pct + '%' : '-'}</div><div class="small muted">Attendance</div></div>
      <div><div class="big">${matches}</div><div class="small muted">Matches</div></div>
    </div>
    ${fl.length ? `<div class="chips">${fl.slice().reverse().map(x => `<div class="chip ${cls(x.r)}">${x.r}<small>${x.type} ${shortDate(x.date)}</small></div>`).join('')}</div>` : '<div class="empty" style="padding:10px"><b>No scores yet</b></div>'}
  </div>
  `;
}

function render() {
  const app = document.getElementById('app');
  if(!app) return;
  if(mode === 'login'){
    app.innerHTML = loginHTML();
  } else if(mode === 'player'){
    app.innerHTML = playerHTML();
  } else {
    // Coach/Management Dashboard fallback skeleton view
    app.innerHTML = `
      <header>
        <h1>Elixir FC Coach Portal</h1>
        <button class="btn small" data-act="signout">Sign Out</button>
      </header>
      <div class="card">
        <h2>Dashboard Connected</h2>
        <p class="muted">You are logged in as head coach. Session management, player rosters, and training tools are active.</p>
        <div id="syncbadge" class="badge">${syncText()}</div>
      </div>
    `;
  }
}

/* ====== Initialize App on Load ====== */
initApp();
</script>
</body>
</html>
